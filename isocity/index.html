<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Пиксельный город · строительство и зоны</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1118;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #city {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
        cursor: crosshair;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <canvas id="city"></canvas>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
