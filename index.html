<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Платформа с домом</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0e0e1e;font-family:'Nunito',sans-serif}
body{touch-action:none;user-select:none}
#wrap{position:relative;width:100%;height:100%}
canvas#game{width:100%;height:100%;display:block;image-rendering:pixelated;cursor:grab}
canvas#game:active{cursor:grabbing}
#top{
  position:absolute;top:16px;left:50%;transform:translateX(-50%);
  display:flex;gap:10px;align-items:center;z-index:10;
}
.pill{
  background:#1a1a2e;border:2px solid #2a2a45;border-radius:14px;
  padding:10px 16px;display:flex;align-items:center;gap:10px;
  box-shadow:0 6px 18px rgba(0,0,0,0.3);
}
#title{font-family:'Press Start 2P',monospace;font-size:9px;color:#fff;letter-spacing:0.04em}
#sub{font-size:11px;color:#8a8ab0}
#genBtn{
  background:#ffcc02;border:none;border-bottom:3px solid #b48f00;border-radius:12px;
  padding:12px 18px;font-family:'Press Start 2P',monospace;font-size:8px;color:#121212;
  cursor:pointer;box-shadow:0 4px 12px rgba(255,204,2,0.35);
}
#genBtn:active{transform:translateY(2px);border-bottom-width:1px}
#genBtn:hover{filter:brightness(1.05)}
#right{
  position:absolute;right:16px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:8px;z-index:10;
}
.btn{
  width:44px;height:44px;border-radius:12px;background:#1a1a2e;border:2px solid #2a2a45;
  color:#fff;font-size:18px;display:grid;place-items:center;cursor:pointer;
}
.btn:hover{border-color:#ffcc02}
#bottom{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  background:rgba(26,26,46,0.9);border:2px solid #2a2a45;border-radius:999px;
  padding:8px 14px;color:#8a8ab0;font-size:12px;z-index:10;display:flex;gap:8px;
}
#bottom b{color:#ffcc02}
#seedTag{
  position:absolute;top:78px;left:50%;transform:translateX(-50%);
  background:rgba(26,26,46,0.9);border:1px solid #2a2a45;border-radius:999px;
  padding:6px 12px;font-family:'Press Start 2P',monospace;font-size:7px;color:#6e6e90;z-index:10;
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="top">
    <div class="pill">
      <div style="width:34px;height:34px;background:#ffcc02;border-radius:8px;display:grid;place-items:center;font-family:'Press Start 2P',monospace;font-size:10px;color:#121212">⌂</div>
      <div>
        <div id="title">ПЛАТФОРМА С ДОМОМ</div>
        <div id="sub">покрути камеру — свободное 360°</div>
      </div>
    </div>
    <button id="genBtn">🎲 НОВЫЙ ДОМ</button>
  </div>

  <div id="seedTag">SEED: <span id="seedVal">—</span></div>

  <div id="right">
    <button class="btn" id="btnL">↺</button>
    <button class="btn" id="btnR">↻</button>
    <button class="btn" id="btnIn">＋</button>
    <button class="btn" id="btnOut">－</button>
  </div>

  <div id="bottom"><span>🖱️ <b>тяни</b> — вращать</span><span>•</span><span><b>колёсико</b> — зум</span><span>•</span><span><b>Q/E</b> — поворот</span></div>
</div>

<script>
(() => {
const TILE_W=64, TILE_H=32, TILE_Z=18;
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
let W=innerWidth, H=innerHeight, DPR=Math.min(devicePixelRatio||1,2);
function resize(){ W=innerWidth; H=innerHeight; canvas.width=W*DPR; canvas.height=H*DPR; canvas.style.width=W+'px'; canvas.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize', resize); resize();

// rng
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }}
let rng=mulberry(hash("init")), currentSeed="";
function setSeed(s){ currentSeed=s; document.getElementById('seedVal').textContent=s; let h=hash(s); rng=mulberry(h); }
function randSeed(){ return Math.random().toString(36).slice(2,6).toUpperCase()+"-"+Math.floor(Math.random()*9000+1000); }
setSeed(randSeed());

const camera={ angle:-0.7, targetAngle:-0.7, zoom:1.15, targetZoom:1.15 };

// ПЛАТФОРМА — фиксированная 10x10
const PLAT_W=10, PLAT_H=10;
let platform=[];
function buildPlatform(){
  platform=[];
  for(let x=0;x<PLAT_W;x++) for(let y=0;y<PLAT_H;y++){
    let wx=x - PLAT_W/2 + 0.5, wy=y - PLAT_H/2 + 0.5;
    platform.push({x,y,wx,wy,h:0}); // h=0 верх
  }
}
buildPlatform();

// ДОМ — рандомная генерация
let house=null;
const WALL_PALETTE=[
  {wall:'#e8dcc6', wall2:'#cbb89a', name:'Бежевый'},
  {wall:'#d7b89c', wall2:'#b89a7a', name:'Деревянный'},
  {wall:'#eceff1', wall2:'#cfd8dc', name:'Белый'},
  {wall:'#f8bbd0', wall2:'#f48fb1', name:'Розовый'},
  {wall:'#ffcc80', wall2:'#ffb74d', name:'Жёлтый'},
  {wall:'#a5d6a7', wall2:'#81c784', name:'Зелёный'},
  {wall:'#90caf9', wall2:'#64b5f6', name:'Голубой'},
  {wall:'#b39ddb', wall2:'#9575cd', name:'Фиолетовый'},
  {wall:'#bc8a6a', wall2:'#a66a4a', name:'Кирпич'},
  {wall:'#8d6e63', wall2:'#6d4c41', name:'Тёмное дерево'},
];
const ROOF_PALETTE=[
  {col:'#8d6e63', col2:'#5d4037', name:'Коричневый'},
  {col:'#37474f', col2:'#263238', name:'Графит'},
  {col:'#c62828', col2:'#8e0000', name:'Красный'},
  {col:'#2e7d32', col2:'#1b5e20', name:'Зелёный'},
  {col:'#1565c0', col2:'#0d47a1', name:'Синий'},
  {col:'#ef6c00', col2:'#e65100', name:'Оранжевый'},
  {col:'#6a1b9a', col2:'#4a148c', name:'Пурпур'},
];

function generateHouse(seed){
  if(seed) setSeed(seed); else setSeed(randSeed());
  let w = 2 + Math.floor(rng()*3); // 2-4
  let d = 2 + Math.floor(rng()*3);
  let h = 1.6 + rng()*1.0; // высота стен
  // не даём дому вылезти за платформу (платформа 10x10, центр 0,0, края +-4.5)
  // дом w=4 => половина 2, влезает
  let wall=WALL_PALETTE[Math.floor(rng()*WALL_PALETTE.length)];
  let roof=ROOF_PALETTE[Math.floor(rng()*ROOF_PALETTE.length)];
  let roofType = ['gable','flat','pyramid'][Math.floor(rng()*3)];
  // если плоская — иногда делаем чуть ниже
  if(roofType==='flat') h*=0.9;
  let hasChimney = rng()<0.7;
  let hasPorch = rng()<0.35;
  let windows = 1 + Math.floor(rng()*2); // 1-2 на боковых

  house={ x:0, y:0, w, d, h, wall, roof, roofType, hasChimney, hasPorch, windows, baseH:0, seed:currentSeed };
}
generateHouse(currentSeed);

function worldToScreen(wx,wy,wz){
  let dx=wx, dy=wy;
  let c=Math.cos(camera.angle), s=Math.sin(camera.angle);
  let rx=dx*c - dy*s, ry=dx*s + dy*c;
  let sx=(rx - ry)*(TILE_W/2);
  let sy=(rx + ry)*(TILE_H/2) - wz*TILE_Z;
  sx=sx*camera.zoom + W/2;
  sy=sy*camera.zoom + H/2 + 14;
  return {x:sx,y:sy,rx,ry,depth:rx+ry};
}

// input rotation
let isDrag=false, lastX=0;
canvas.addEventListener('mousedown', e=>{ if(e.button===0||e.button===2){isDrag=true; lastX=e.clientX; e.preventDefault();}});
addEventListener('mouseup', ()=> isDrag=false);
addEventListener('mousemove', e=>{ if(!isDrag) return; let dx=e.clientX-lastX; lastX=e.clientX; camera.targetAngle+=dx*0.007; });
canvas.addEventListener('contextmenu', e=> e.preventDefault());
canvas.addEventListener('wheel', e=>{ e.preventDefault(); let d=Math.sign(e.deltaY)*0.08; camera.targetZoom=Math.max(0.7,Math.min(1.9, camera.targetZoom - d)); }, {passive:false});
let tid=null, sx0=0, ang0=0;
canvas.addEventListener('touchstart', e=>{ if(e.touches.length===1){ let t=e.touches[0]; tid=t.identifier; sx0=t.clientX; ang0=camera.targetAngle; }},{passive:false});
canvas.addEventListener('touchmove', e=>{ for(let t of e.touches) if(t.identifier===tid){ let dx=t.clientX-sx0; camera.targetAngle=ang0+dx*0.007; e.preventDefault(); }},{passive:false});
addEventListener('touchend', ()=> tid=null);
addEventListener('keydown', e=>{
  if(e.key.toLowerCase()==='q') camera.targetAngle-=0.15;
  if(e.key.toLowerCase()==='e') camera.targetAngle+=0.15;
  if(e.key===' '||e.key==='Enter'){ generateHouse(); }
});
document.getElementById('btnL').onclick=()=> camera.targetAngle-=0.3;
document.getElementById('btnR').onclick=()=> camera.targetAngle+=0.3;
document.getElementById('btnIn').onclick=()=> camera.targetZoom=Math.min(1.9,camera.targetZoom+0.12);
document.getElementById('btnOut').onclick=()=> camera.targetZoom=Math.max(0.7,camera.targetZoom-0.12);
document.getElementById('genBtn').onclick=()=> generateHouse();

function shade(hex,f){
  let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  r=Math.round(r*f); g=Math.round(g*f); b=Math.round(b*f);
  return `rgb(${Math.max(0,Math.min(255,r))},${Math.max(0,Math.min(255,g))},${Math.max(0,Math.min(255,b))})`;
}

function render(){
  // sky
  let grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#87ceeb'); grd.addColorStop(1,'#e1f5fe');
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);
  // clouds
  ctx.fillStyle='rgba(255,255,255,0.85)';
  for(let i=0;i<3;i++){
    let cx=(W*0.2+i*W*0.28 + Math.sin(Date.now()*0.00012+i)*10)%W;
    let cy=H*0.13 + Math.cos(i)*8;
    ctx.fillRect(cx,cy,24,12); ctx.fillRect(cx+6,cy-6,12,6);
  }

  let cos=Math.cos(camera.angle), sin=Math.sin(camera.angle);
  let viewX=cos+sin, viewY=cos - sin; let vl=Math.hypot(viewX,viewY); viewX/=vl; viewY/=vl;
  let lightX=-0.6, lightY=-0.8; let ll=Math.hypot(lightX,lightY); lightX/=ll; lightY/=ll;

  let faces=[], sprites=[];

  // платформа
  for(let t of platform){
    let topZ=0;
    let vTop=[
      {wx:t.wx-0.5, wy:t.wy-0.5, wz:topZ},
      {wx:t.wx+0.5, wy:t.wy-0.5, wz:topZ},
      {wx:t.wx+0.5, wy:t.wy+0.5, wz:topZ},
      {wx:t.wx-0.5, wy:t.wy+0.5, wz:topZ},
    ];
    let pTop=vTop.map(v=> worldToScreen(v.wx,v.wy,v.wz));
    let dTop=pTop.reduce((a,p)=>a+p.depth,0)/4;
    faces.push({verts:vTop, proj:pTop, depth:dTop, type:'top'});

    // стены платформы — только по краю
    let isEdge = t.x===0||t.x===PLAT_W-1||t.y===0||t.y===PLAT_H-1;
    if(isEdge){
      let neighs=[
        {dx:1,dy:0,n:{x:1,y:0}, edge:[{wx:t.wx+0.5,wy:t.wy-0.5},{wx:t.wx+0.5,wy:t.wy+0.5}]},
        {dx:-1,dy:0,n:{x:-1,y:0}, edge:[{wx:t.wx-0.5,wy:t.wy+0.5},{wx:t.wx-0.5,wy:t.wy-0.5}]},
        {dx:0,dy:1,n:{x:0,y:1}, edge:[{wx:t.wx+0.5,wy:t.wy+0.5},{wx:t.wx-0.5,wy:t.wy+0.5}]},
        {dx:0,dy:-1,n:{x:0,y:-1}, edge:[{wx:t.wx-0.5,wy:t.wy-0.5},{wx:t.wx+0.5,wy:t.wy-0.5}]},
      ];
      for(let nb of neighs){
        let nx=t.x+nb.dx, ny=t.y+nb.dy;
        let inside = nx>=0&&nx<PLAT_W&&ny>=0&&ny<PLAT_H;
        if(inside) continue; // внутри не рисуем швы
        let dot=nb.n.x*viewX + nb.n.y*viewY; if(dot<=0.01) continue;
        let verts=[
          {wx:nb.edge[0].wx, wy:nb.edge[0].wy, wz:-1.6},
          {wx:nb.edge[0].wx, wy:nb.edge[0].wy, wz:topZ},
          {wx:nb.edge[1].wx, wy:nb.edge[1].wy, wz:topZ},
          {wx:nb.edge[1].wx, wy:nb.edge[1].wy, wz:-1.6},
        ];
        let proj=verts.map(v=> worldToScreen(v.wx,v.wy,v.wz));
        let depth=proj.reduce((a,p)=>a+p.depth,0)/4;
        let shadeV=0.9 + (nb.n.x*lightX+nb.n.y*lightY)*0.1;
        faces.push({verts, proj, depth, type:'wall', shade:shadeV});
      }
    }
  }

  // дом
  if(house){
    let hx=house.w/2, hy=house.d/2, hh=house.h, bh=house.baseH;
    // стены
    let walls=[
      {a:{wx:-hx, wy:-hy}, b:{wx:hx, wy:-hy}, n:{x:0,y:-1}},
      {a:{wx:hx, wy:-hy}, b:{wx:hx, wy:hy}, n:{x:1,y:0}},
      {a:{wx:hx, wy:hy}, b:{wx:-hx, wy:hy}, n:{x:0,y:1}},
      {a:{wx:-hx, wy:hy}, b:{wx:-hx, wy:-hy}, n:{x:-1,y:0}},
    ];
    for(let e of walls){
      let dot=e.n.x*viewX + e.n.y*viewY; if(dot<=0.01) continue;
      let verts=[
        {wx:e.a.wx, wy:e.a.wy, wz:bh},
        {wx:e.a.wx, wy:e.a.wy, wz:bh+hh},
        {wx:e.b.wx, wy:e.b.wy, wz:bh+hh},
        {wx:e.b.wx, wy:e.b.wy, wz:bh},
      ];
      let proj=verts.map(v=> worldToScreen(v.wx,v.wy,v.wz));
      let depth=proj.reduce((a,p)=>a+p.depth,0)/4;
      let sh=0.94 + (e.n.x*lightX+e.n.y*lightY)*0.06;
      faces.push({verts, proj, depth, type:'houseWall', wall:e, shade:sh, house});
    }
    // крыша
    if(house.roofType==='flat'){
      let v=[
        {wx:-hx, wy:-hy, wz:bh+hh},
        {wx:hx, wy:-hy, wz:bh+hh},
        {wx:hx, wy:hy, wz:bh+hh},
        {wx:-hx, wy:hy, wz:bh+hh},
      ];
      let proj=v.map(p=> worldToScreen(p.wx,p.wy,p.wz));
      faces.push({verts:v, proj, depth:proj.reduce((a,p)=>a+p.depth,0)/4, type:'roofFlat', house});
    } else if(house.roofType==='pyramid'){
      let apex={wx:0, wy:0, wz:bh+hh+0.9};
      let base=[{wx:-hx,wy:-hy,wz:bh+hh},{wx:hx,wy:-hy,wz:bh+hh},{wx:hx,wy:hy,wz:bh+hh},{wx:-hx,wy:hy,wz:bh+hh}];
      for(let i=0;i<4;i++){
        let v=[base[i], base[(i+1)%4], apex];
        let proj=v.map(p=> worldToScreen(p.wx,p.wy,p.wz));
        faces.push({verts:v, proj, depth:proj.reduce((a,p)=>a+p.depth,0)/3, type:'roofTri', house});
      }
    } else { // gable
      let ridgeH=0.7 + Math.min(hx,hy)*0.25;
      let ridgeAxis = hx >= hy ? 'x' : 'y';
      let roofParts=[];
      if(ridgeAxis==='x'){
        roofParts=[
          [{wx:-hx,wy:0,wz:bh+hh+ridgeH},{wx:-hx,wy:-hy,wz:bh+hh},{wx:hx,wy:-hy,wz:bh+hh},{wx:hx,wy:0,wz:bh+hh+ridgeH}],
          [{wx:-hx,wy:0,wz:bh+hh+ridgeH},{wx:hx,wy:0,wz:bh+hh+ridgeH},{wx:hx,wy:hy,wz:bh+hh},{wx:-hx,wy:hy,wz:bh+hh}]
        ];
      } else {
        roofParts=[
          [{wx:0,wy:-hy,wz:bh+hh+ridgeH},{wx:hx,wy:-hy,wz:bh+hh},{wx:hx,wy:hy,wz:bh+hh},{wx:0,wy:hy,wz:bh+hh+ridgeH}],
          [{wx:0,wy:-hy,wz:bh+hh+ridgeH},{wx:0,wy:hy,wz:bh+hh+ridgeH},{wx:-hx,wy:hy,wz:bh+hh},{wx:-hx,wy:-hy,wz:bh+hh}]
        ];
      }
      for(let part of roofParts){
        let proj=part.map(p=> worldToScreen(p.wx,p.wy,p.wz));
        faces.push({verts:part, proj, depth:proj.reduce((a,p)=>a+p.depth,0)/4, type:'roofGable', house});
      }
      // фронтоны
      let gables=[];
      if(ridgeAxis==='x'){
        gables=[
          [{wx:-hx,wy:-hy,wz:bh+hh},{wx:-hx,wy:0,wz:bh+hh+ridgeH},{wx:-hx,wy:hy,wz:bh+hh}],
          [{wx:hx,wy:hy,wz:bh+hh},{wx:hx,wy:0,wz:bh+hh+ridgeH},{wx:hx,wy:-hy,wz:bh+hh}]
        ];
      } else {
        gables=[
          [{wx:-hx,wy:-hy,wz:bh+hh},{wx:0,wy:-hy,wz:bh+hh+ridgeH},{wx:hx,wy:-hy,wz:bh+hh}],
          [{wx:hx,wy:hy,wz:bh+hh},{wx:0,wy:hy,wz:bh+hh+ridgeH},{wx:-hx,wy:hy,wz:bh+hh}]
        ];
      }
      for(let g of gables){
        let proj=g.map(p=> worldToScreen(p.wx,p.wy,p.wz));
        faces.push({verts:g, proj, depth:proj.reduce((a,p)=>a+p.depth,0)/3, type:'gable', house});
      }
    }
    // труба
    if(house.hasChimney){
      let cx=hx*0.5, cy=-hy*0.4;
      let chim=[
        {a:{wx:cx-0.2,wy:cy-0.2}, b:{wx:cx+0.2,wy:cy-0.2}, n:{x:0,y:-1}},
        {a:{wx:cx+0.2,wy:cy-0.2}, b:{wx:cx+0.2,wy:cy+0.2}, n:{x:1,y:0}},
        {a:{wx:cx+0.2,wy:cy+0.2}, b:{wx:cx-0.2,wy:cy+0.2}, n:{x:0,y:1}},
        {a:{wx:cx-0.2,wy:cy+0.2}, b:{wx:cx-0.2,wy:cy-0.2}, n:{x:-1,y:0}},
      ];
      for(let e of chim){
        let dot=e.n.x*viewX + e.n.y*viewY; if(dot<=0.01) continue;
        let verts=[
          {wx:e.a.wx, wy:e.a.wy, wz:bh+hh},
          {wx:e.a.wx, wy:e.a.wy, wz:bh+hh+0.85},
          {wx:e.b.wx, wy:e.b.wy, wz:bh+hh+0.85},
          {wx:e.b.wx, wy:e.b.wy, wz:bh+hh},
        ];
        let proj=verts.map(v=> worldToScreen(v.wx,v.wy,v.wz));
        faces.push({verts, proj, depth:proj.reduce((a,p)=>a+p.depth,0)/4, type:'chimney'});
      }
      let topV=[{wx:cx-0.2,wy:cy-0.2,wz:bh+hh+0.85},{wx:cx+0.2,wy:cy-0.2,wz:bh+hh+0.85},{wx:cx+0.2,wy:cy+0.2,wz:bh+hh+0.85},{wx:cx-0.2,wy:cy+0.2,wz:bh+hh+0.85}];
      let pTop=topV.map(v=> worldToScreen(v.wx,v.wy,v.wz));
      faces.push({verts:topV, proj:pTop, depth:pTop.reduce((a,p)=>a+p.depth,0)/4, type:'chimneyTop'});
    }
  }

  // сортировка
  let list=[];
  for(let f of faces) list.push({depth:f.depth, kind:'face', f});
  list.sort((a,b)=> a.depth - b.depth);

  ctx.imageSmoothingEnabled=false;
  for(let it of list){
    let f=it.f;
    let proj=f.proj;
    ctx.beginPath(); ctx.moveTo(proj[0].x, proj[0].y);
    for(let i=1;i<proj.length;i++) ctx.lineTo(proj[i].x, proj[i].y);
    ctx.closePath();

    if(f.type==='top'){
      ctx.fillStyle='#7bc67e';
      ctx.fill();
      // пиксельные детали травы
      let cx=(proj[0].x+proj[2].x)/2, cy=(proj[0].y+proj[2].y)/2;
      ctx.fillStyle='rgba(60,120,60,0.18)'; ctx.fillRect(cx-4,cy-2,2,2); ctx.fillRect(cx+3,cy+2,2,2);
      ctx.strokeStyle='rgba(0,0,0,0.08)'; ctx.lineWidth=1; ctx.stroke();
    } else if(f.type==='wall'){
      ctx.fillStyle=shade('#9aa08a', f.shade);
      ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.stroke();
      // трава на краю
      ctx.fillStyle='#7bc67e'; ctx.fillRect((proj[1].x+proj[2].x)/2-6, (proj[1].y+proj[2].y)/2-1, 12,3);
    } else if(f.type==='houseWall'){
      let col=shade(f.house.wall.wall, f.shade);
      ctx.fillStyle=col; ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.14)'; ctx.lineWidth=1; ctx.stroke();
      // окна/дверь
      let cx=(proj[0].x+proj[1].x+proj[2].x+proj[3].x)/4;
      let cy=(proj[0].y+proj[1].y+proj[2].y+proj[3].y)/4;
      let isFront = f.wall.n.y===1; // юг — фасад
      if(isFront){
        // дверь
        ctx.fillStyle='#4e342e'; let w=10*camera.zoom, h=14*camera.zoom;
        ctx.fillRect(cx-w/2, cy - h/2 + 5*camera.zoom, w, h);
        ctx.fillStyle='#3e2723'; ctx.fillRect(cx-w/2, cy+h/2-1, w,2);
        ctx.fillStyle='#ffcc02'; ctx.fillRect(cx+2, cy+1, 2,2);
        // окно рядом
        ctx.fillStyle='#1a237e'; ctx.fillRect(cx-20*camera.zoom, cy-4*camera.zoom, 8*camera.zoom,8*camera.zoom);
        ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.strokeRect(cx-20*camera.zoom, cy-4*camera.zoom, 8*camera.zoom,8*camera.zoom);
      } else {
        // боковое окно
        ctx.fillStyle='#1a237e'; let w=8*camera.zoom, h=8*camera.zoom;
        ctx.fillRect(cx-w/2, cy-h/2, w, h);
        ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.strokeRect(cx-w/2, cy-h/2, w, h);
        ctx.beginPath(); ctx.moveTo(cx, cy-h/2); ctx.lineTo(cx, cy+h/2); ctx.moveTo(cx-w/2, cy); ctx.lineTo(cx+w/2, cy); ctx.stroke();
      }
    } else if(f.type==='roofFlat'){
      ctx.fillStyle=shade(f.house.roof.col2,0.95); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.stroke();
      // маленький бортик
      ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fillRect(proj[0].x+4, proj[0].y+4, 6,3);
    } else if(f.type==='roofGable' || f.type==='roofTri'){
      ctx.fillStyle=shade(f.house.roof.col, 0.96); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.stroke();
    } else if(f.type==='gable'){
      ctx.fillStyle=shade(f.house.wall.wall2,0.88); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.13)'; ctx.stroke();
      // круглое окно на фронтоне
      let cx=(proj[0].x+proj[1].x+proj[2].x)/3, cy=(proj[0].y+proj[1].y+proj[2].y)/3;
      ctx.fillStyle='#1a237e'; ctx.beginPath(); ctx.arc(cx, cy+2*camera.zoom, 5*camera.zoom,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.stroke();
    } else if(f.type==='chimney'){
      ctx.fillStyle='#4e342e'; ctx.fill(); ctx.strokeStyle='rgba(0,0,0,0.14)'; ctx.stroke();
    } else if(f.type==='chimneyTop'){
      ctx.fillStyle='#3e2723'; ctx.fill(); ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.stroke();
    }
  }

  // тень под платформой
  let sh=worldToScreen(0,0,-1.6);
  ctx.fillStyle='rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(sh.x, sh.y+8, 78*camera.zoom, 28*camera.zoom,0,0,Math.PI*2); ctx.fill();

  // виньетка
  let vig=ctx.createRadialGradient(W/2,H/2, Math.min(W,H)*0.5, W/2,H/2, Math.min(W,H)*0.95);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.20)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
}

let last=performance.now();
function loop(){
  let now=performance.now(), dt=Math.min(0.033,(now-last)/1000); last=now;
  let da=camera.targetAngle - camera.angle;
  while(da>Math.PI) da-=Math.PI*2;
  while(da<-Math.PI) da+=Math.PI*2;
  camera.angle += da*0.09;
  camera.zoom += (camera.targetZoom - camera.zoom)*0.11;
  render();
  requestAnimationFrame(loop);
}
loop();
})();
</script>
</body>
</html>
