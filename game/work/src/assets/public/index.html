<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2013">
<title>Kingdom Crash</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud" class="hidden">
    <div id="topbar">
      <div id="flag"></div>
      <div id="nation"></div>
      <div id="score"></div>
      <div id="clock"></div>
      <button class="px" id="burger" data-act="menu"><span></span><span></span><span></span></button>
    </div>
    <div id="resbar"></div>
    <button class="px" id="inboxBtn" data-act="inbox"><div id="inboxIc"></div><div class="lbl">ВХОДЯЩ.</div><b id="badge" class="hidden">0</b></button>
    <div id="toasts"></div>
    <button class="px" id="plan" data-act="plan"></button>
    <canvas id="mm" width="160" height="160" class="hidden"></canvas>
    <div id="sheet" class="hidden"></div>
    <div id="tabs"></div>
    <div id="bar"></div>
  </div>

  <div id="menu" class="screen">
    <div class="title"><div class="t1">KINGDOM</div><div class="t2">CRASH</div></div>
    <div class="sub">средневековая стратегия</div>
    <div class="col">
      <button class="px big" data-act="newgame">ИГРАТЬ</button>
      <button class="px big" id="contBtn" data-act="continue">ПРОДОЛЖИТЬ</button>
      <button class="px big" data-act="howto">КАК ИГРАТЬ</button>
    </div>
  </div>
  <div id="fade"></div>

  <div id="create" class="screen hidden"></div>
  <div id="modal" class="hidden"></div>
</div>
<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/game.js"></script>
<script src="js/ai.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
