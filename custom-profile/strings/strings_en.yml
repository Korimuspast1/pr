plugin_description: "A local visual editor for your own profile: verified check, Premium, star rating, name, bio, colours, emoji status and profiles panels. Read-only by default, nothing is sent to Telegram."
settings_title: "Custom Profile"
settings_notice: "This device only"
settings_notice_subtext: "Changes exist only in exteraGram's interface. Telegram and other people still see the real profile."
enabled: "Enable local visual profile"
enabled_subtext: "Turning it off restores the remembered in-memory values."
scope: "Accounts to preview"
scope_subtext: "The plugin only ever touches your own signed-in accounts, never somebody else's profile."
scope_active: "Active account only"
scope_all: "All signed-in accounts"
patch_mode: "Cache patch mode"
patch_mode_subtext: "Read-only is recommended: the local cache keeps Telegram's real values and only rendered copies are decorated."
patch_mode_read_only: "Read-only (recommended)"
patch_mode_updates: "Also patch incoming updates"
badges_title: "Badges"
verified: "Verified check"
verified_subtext: "The standard Telegram check beside the name — local only."
premium: "Telegram Premium badge"
premium_subtext: "Visual Premium for your profile. It does not unlock a subscription, limits or server-side features."
emoji_status_enabled: "Emoji status"
emoji_status_enabled_subtext: "Shows a custom emoji status from a document ID when the client already knows that emoji."
emoji_status_id: "Emoji-status document ID"
emoji_status_id_subtext: "The long numeric ID of a custom emoji. Leave blank or use 0 to avoid replacing the status."
stars_title: "Star profile"
stars_enabled: "Show a star rating"
stars_enabled_subtext: "Shows the native crown/level in the profile header and a star amount in its card. It is not a wallet balance."
stars_amount: "Profile star amount"
stars_amount_subtext: "Any whole number from 0 to 9,000,000,000,000,000,000. Visual only."
stars_level: "Crown level"
stars_level_subtext: "A whole number from 1 to 99."
appearance_title: "Appearance"
display_name: "Display name"
display_name_subtext: "Leave empty to keep the real name. Control and text-direction characters are stripped."
display_username: "Local @username"
display_username_subtext: "5–32 characters, letters/digits/underscore, must start with a letter. The @ sign is optional."
display_bio: "Local bio"
display_bio_hint: "Leave empty to keep the real profile description."
name_color_enabled: "Name colour"
name_color_enabled_subtext: "Uses Telegram's built-in palette; choose a colour below."
name_color_index: "Name colour"
profile_color_enabled: "Profile colour"
profile_color_enabled_subtext: "Uses Telegram's built-in palette; choose a colour below."
profile_color_index: "Profile colour"
color_0: "Red"
color_1: "Orange"
color_2: "Violet"
color_3: "Green"
color_4: "Cyan"
color_5: "Blue"
color_6: "Pink"
honesty_title: "Honesty marker"
watermark_enabled: "Add a preview marker to the name"
watermark_enabled_subtext: "Appends a small suffix so a local screenshot can never be mistaken for a real profile. Recommended."
watermark_text: "Marker text"
watermark_text_subtext: "Up to 24 characters, e.g. ·preview."
themes_title: "Presets"
preset: "Apply a preset"
preset_subtext: "A one-tap combination of badge and colour settings. Presets never change the marker or the patch mode."
preset_keep: "Keep current values"
preset_minimal: "Minimal: Premium only"
preset_full: "Full preview: check + Premium + stars + colours"
preset_off: "Everything off"
preset_applied: "Preset applied to the local preview."
actions_title: "Actions"
apply: "Apply to the open profile"
apply_subtext: "Refreshes in-memory objects. If the profile is already open, close and open it again."
panels_title: "Presets and panels"
panels_subtext: "Copy a preset to the clipboard or paste one back."
panels_info: "A preset is a small JSON blob with your visual settings. It never contains your account, phone number or messages."
panel_copy_preset: "Copy current preset"
panel_copy_preset_subtext: "Copies a JSON blob you can keep or share as a style preset."
panel_paste_preset: "Paste a preset"
panel_paste_preset_subtext: "Reads JSON from the clipboard. Unknown keys and invalid values are ignored."
panel_restore_now: "Restore real values now"
panel_restore_now_subtext: "Drops every in-memory override immediately."
preset_stored: "Clipboard unavailable — the preset was stored locally."
paste_empty: "Clipboard is empty."
paste_invalid: "That is not a valid Custom Profile preset."
paste_applied: "Preset imported and applied."
restored_now: "All local overrides were restored."
reset: "Reset visual profile"
reset_subtext: "Returns settings to safe defaults and removes the in-memory override."
about: "Limits and honest use"
about_subtext: "No requests go to Telegram; it creates no real Stars, Premium or verification. Do not use the local look as proof to other people."
about_page_title: "About Custom Profile"
about_limits: "Telegram has no public field for arbitrary badges. This plugin only exposes the fields a regular account already renders: the verified check, Premium, emoji status, peer colours and the profile star rating."
about_no_requests: "It never sends a Telegram request."
about_no_server_writes: "It never writes an account setting or a server profile."
about_restore: "Every override is remembered and restored when disabled or unloaded."
about_watermark: "A preview marker is appended to the name unless you disable it."
about_version: "Custom Profile {version} — MIT licensed."
