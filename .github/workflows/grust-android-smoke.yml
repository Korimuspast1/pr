name: Грусть emulator smoke test

# Starts after "Build Грусть APK" finishes and walks the app through every screen on an emulator.
#
# It is a separate workflow for one reason: workflow_run is the only trigger that does not need
# anything from the caller, and a workflow cannot be triggered by its own completion. Anything the
# job learns is printed as ::notice / ::error, because the run logs are not downloadable from where
# the project is maintained.
#
# The screenshots it takes are committed back to the branch, so the app can be looked at without a
# phone and without a login.

on:
  workflow_run:
    workflows: ["Build Грусть APK"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grust-smoke-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Emulator smoke test
    # A failed build has nothing to smoke; a successful one is exactly what this job is for.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAVA_VERSION: '17'
      COMPILE_SDK: '37'
      BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    defaults:
      run:
        working-directory: grust-android
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        run: bash tools/ci-android-sdk.sh

      - name: Build the debug APK
        # The debug variant is what the release build was signed as, but with its own application
        # id, so an already installed copy of the app is not overwritten by the test run.
        run: bash tools/ci-gradle.sh 'assembleDebug'

      - name: Enable KVM
        # Without KVM the x86_64 emulator is unusably slow; this is the rule the other Android jobs
        # in this repository use.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Walk through the app on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: grust-android
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          emulator-boot-timeout: 1500
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          script: |
            set -o pipefail
            apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
            bash tools/ci-smoke.sh "$apk" ../screenshots-capture 2>&1 | tee ../smoke.log

      - name: Commit the screenshots
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(ls -A ../screenshots-capture 2>/dev/null)" ]; then
            echo "::notice title=Smoke::no screenshots to commit"
            exit 0
          fi
          rm -rf screenshots && mkdir -p screenshots
          cp ../screenshots-capture/*.png screenshots/
          ls -l screenshots | sed -E 's|^(.*)$|::notice title=Screenshot::\1|'
          git add -f screenshots
          if git diff --cached --quiet; then
            echo "::notice title=Smoke::screenshots unchanged"
            exit 0
          fi
          git commit -m "CI: screenshots of the app on API 34 [skip ci]"
          git push origin "HEAD:${BRANCH}"
          echo "::notice title=Smoke::screenshots committed to ${BRANCH}"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Grust-screenshots
          path: |
            screenshots-capture/*.png
            smoke.log
          if-no-files-found: ignore
