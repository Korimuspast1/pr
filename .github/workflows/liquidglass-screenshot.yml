name: Liquid Glass Lab screenshots

# Boots a real emulator, installs the APK, walks through the tabs and uploads
# screenshots. This is the only way to see what the material actually looks like
# on a device GPU (swiftshader), so it doubles as a smoke test.

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/2dafe562-pr"
    paths:
      - "liquidglass/app/**"
      - "liquidglass/shader/**"
      - ".github/workflows/liquidglass-screenshot.yml"

permissions:
  contents: write

concurrency:
  group: liquidglass-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        working-directory: liquidglass
        run: |
          SDK="$ANDROID_HOME"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" "build-tools;34.0.0" >/dev/null
          python3 tools/build_apk.py --out "$GITHUB_WORKSPACE/lab.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 1800
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: |
            set -x
            adb install -r "$GITHUB_WORKSPACE/lab.apk"
            adb shell am start -W -n dev.arena.liquidglasslab/.MainActivity
            sleep 12
            W=$(adb shell wm size | tail -1 | sed 's/.*: //' | cut -dx -f1)
            H=$(adb shell wm size | tail -1 | sed 's/.*: //' | cut -dx -f2)
            shot() { adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/$1.png"; }
            mkdir -p "$GITHUB_WORKSPACE/shots"
            shot 01-home
            # bottom tab bar: 4 tabs, capsule inset ~16dp; tap the middle of tab N
            tap_tab() { X=$(( W * ($1 * 2 + 1) / 8 )); Y=$(( H - H / 24 )); adb shell input tap $X $Y; sleep 3; }
            tap_tab 1; shot 02-presets
            tap_tab 2; shot 03-scene
            tap_tab 3; shot 04-tuning
            tap_tab 0; sleep 1
            # open the menu from the toolbar's left trailing button
            adb shell input tap $(( W - W / 12 )) $(( H / 16 ))
            sleep 3
            shot 05-menu
            adb logcat -d | grep -iE "liquidglasslab|FATAL|AndroidRuntime" | tail -n 80 \
              > "$GITHUB_WORKSPACE/shots/logcat.txt" || true
            adb shell pidof dev.arena.liquidglasslab || echo "PROCESS NOT RUNNING"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidglass-screenshots
          path: shots/**
          if-no-files-found: warn

      - name: Commit screenshots to docs/
        if: always()
        continue-on-error: true
        run: |
          mkdir -p liquidglass/docs/img/device
          cp shots/*.png liquidglass/docs/img/device/ 2>/dev/null || true
          cp shots/logcat.txt liquidglass/docs/img/device/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f liquidglass/docs/img/device
          if git diff --cached --quiet; then echo "no new screenshots"; exit 0; fi
          git commit -m "CI: device screenshots [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
