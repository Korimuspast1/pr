name: Liquid Glass Lab screenshots

# Boots a real emulator, installs the APK, walks through the tabs and commits the
# screenshots to liquidglass/docs/img/device/. This is the only way to see what the
# material actually looks like on a device GPU (swiftshader), and it doubles as a
# smoke test: if the app crashes, logcat.txt lands in the same commit.

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/2dafe562-pr"
    paths:
      - "liquidglass/app/**"
      - "liquidglass/shader/**"
      - ".github/workflows/liquidglass-screenshot.yml"

permissions:
  contents: write

concurrency:
  group: liquidglass-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      API: 34
      IMAGE: system-images;android-34;google_apis;x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        working-directory: liquidglass
        run: |
          SDK="$ANDROID_HOME"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" "build-tools;34.0.0" >/dev/null
          python3 tools/build_apk.py --out "$GITHUB_WORKSPACE/lab.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "NO /dev/kvm"

      - name: Boot emulator, install and capture
        run: |
          set -x
          OUT="$GITHUB_WORKSPACE/shots"
          mkdir -p "$OUT"
          exec > >(tee "$OUT/diag.txt") 2>&1
          SDK="$ANDROID_HOME"
          export PATH="$SDK/platform-tools:$SDK/emulator:$PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "emulator" "$IMAGE" "platform-tools" >/dev/null
          ls "$SDK/platform-tools/adb"
          ADB="$SDK/platform-tools/adb"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd -n lab \
            -k "$IMAGE" -d pixel_6 --force
          ls -la "$ANDROID_AVD_HOME"
          "$SDK/emulator/emulator" -list-avds
          "$SDK/emulator/emulator" -avd lab -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu auto -accel auto -memory 3072 -no-snapshot-save -partition-size 4096 \
            -no-metrics > "$OUT/emulator.txt" 2>&1 &
          EMU=$!
          "$SDK/platform-tools/adb" start-server
          # never block forever: the emulator either answers within 10 min or we bail
          timeout 600 "$SDK/platform-tools/adb" wait-for-device || {
            echo "no device after 10 min"; tail -40 "$OUT/emulator.txt"; kill $EMU; exit 1; }
          for i in $(seq 1 120); do
            BOOT=$("$SDK/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOT" = "1" ] && break
            sleep 5
          done
          echo "boot_completed=$BOOT after ${i} polls"
          # a software-rendered emulator ANRs its own System UI; those dialogs steal
          # every tap, so both the dialog and the watchdog report are disabled
          "$SDK/platform-tools/adb" shell settings put global hide_error_dialogs 1 || true
          "$SDK/platform-tools/adb" shell settings put secure anr_show_background 0 || true
          "$SDK/platform-tools/adb" shell settings put global window_animation_scale 0 || true
          "$SDK/platform-tools/adb" shell settings put global transition_animation_scale 0 || true
          "$SDK/platform-tools/adb" shell settings put global animator_duration_scale 0 || true
          timeout 300 "$SDK/platform-tools/adb" install -r "$GITHUB_WORKSPACE/lab.apk" || {
            echo "install failed"; "$SDK/platform-tools/adb" logcat -d | tail -60; }
          timeout 180 "$SDK/platform-tools/adb" shell am start -W \
            -n dev.arena.liquidglasslab/.MainActivity || true
          sleep 12
          SIZE=$("$SDK/platform-tools/adb" shell wm size | tail -1 | sed 's/.*: //')
          W=${SIZE%x*}; H=${SIZE#*x}
          echo "screen=$W x $H"
          shot() { timeout 90 "$SDK/platform-tools/adb" exec-out screencap -p > "$OUT/$1.png"; echo "shot $1 $(stat -c%s "$OUT/$1.png")"; }
          # `adb shell input tap` is unreliable on a software-rendered emulator (taps get
          # dropped and the System UI ANR dialog steals them), so each screenshot opens
          # the tab through the activity intent instead.
          open_tab() {
            if [ -n "$2" ]; then
              "$SDK/platform-tools/adb" shell am start -S \
                -n dev.arena.liquidglasslab/.MainActivity --es tab "$1" --ez menu true \
                >/dev/null 2>&1
            else
              "$SDK/platform-tools/adb" shell am start -S \
                -n dev.arena.liquidglasslab/.MainActivity --es tab "$1" >/dev/null 2>&1
            fi
            # cold start of a software-rendered emulator: wait for the window, then
            # discard one frame so the screenshot never catches a black window
            sleep 10
            "$SDK/platform-tools/adb" exec-out screencap -p > /dev/null 2>&1 || true
            sleep 3
          }
          open_tab home; shot 01-home
          open_tab presets; shot 02-presets
          open_tab scene; shot 03-scene
          open_tab tune; shot 04-tuning
          open_tab home menu; shot 05-menu
          "$SDK/platform-tools/adb" logcat -d > "$OUT/logcat.txt" || true
          grep -iE "liquidglasslab|FATAL|AndroidRuntime" "$OUT/logcat.txt" | tail -n 120 || true
          "$SDK/platform-tools/adb" shell pidof dev.arena.liquidglasslab && echo "APP ALIVE" || echo "APP NOT RUNNING"
          ls -la "$OUT"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquidglass-screenshots
          path: shots/**
          if-no-files-found: warn

      - name: Commit screenshots and diagnostics
        if: always()
        continue-on-error: true
        run: |
          mkdir -p liquidglass/docs/img/device
          cp shots/*.png liquidglass/docs/img/device/ 2>/dev/null || true
          cp shots/diag.txt liquidglass/docs/img/device/ 2>/dev/null || true
          tail -c 4000 shots/emulator.txt > liquidglass/docs/img/device/emulator.txt 2>/dev/null || true
          grep -iE "liquidglasslab|FATAL|AndroidRuntime" shots/logcat.txt \
            > liquidglass/docs/img/device/logcat.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f liquidglass/docs/img/device
          if git diff --cached --quiet; then echo "no new screenshots"; exit 0; fi
          git commit -m "CI: device screenshots [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
