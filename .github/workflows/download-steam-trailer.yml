name: download-steam-trailer

# качает HLS-трейлер Steam и отдаёт mp4 артефактом.
# запуск: запушить изменённый trailer-request.json (или вручную через Actions)
on:
  workflow_dispatch:
    inputs:
      output_name:
        description: 'Имя выходного файла'
        required: true
        default: 'manhunt_trailer.mp4'
  push:
    branches:
      - 'arena/**'
    paths:
      - 'trailer-request.json'

concurrency:
  group: download-steam-trailer
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg
        run: ffmpeg -version | head -1
      - name: читаем запрос
        id: req
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open('trailer-request.json'))
          print("master_url=" + data["master_url"])
          print("output_name=" + data.get("output_name", "trailer.mp4"))
          PY
      - name: скачиваем и собираем трейлер
        run: |
          set -o pipefail
          python3 -u scripts/steam_trailer_dl.py \
            "${{ steps.req.outputs.master_url }}" \
            "${{ steps.req.outputs.output_name }}" 2>&1 | tee trailer.log
      - name: публикуем лог в ветку (для диагностики)
        if: always()
        run: |
          git config user.name "trailer-bot"
          git config user.email "trailer-bot@users.noreply.github.com"
          cp trailer.log trailer-log.txt 2>/dev/null || true
          git add trailer-log.txt
          git diff --cached --quiet || git commit -m "trailer: log (${{ job.status }})"
          git push || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.req.outputs.output_name }}
          path: ${{ steps.req.outputs.output_name }}
          if-no-files-found: error
          retention-days: 7
