name: download-steam-trailer

# запускается вручную: качает HLS-трейлер Steam и отдаёт mp4 артефактом
on:
  workflow_dispatch:
    inputs:
      master_url:
        description: 'URL master-плейлиста (hls_264_master.m3u8)'
        required: true
        default: 'https://video.akamai.steamstatic.com/store_trailers/12130/914/7d17608b928efd9a78554e22fe6ab4979923a460/1750484484/hls_264_master.m3u8?t=1447351212'
      output_name:
        description: 'Имя выходного файла'
        required: true
        default: 'manhunt_trailer.mp4'

concurrency:
  group: download-steam-trailer
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg
        run: ffmpeg -version | head -1
      - name: скачиваем и собираем трейлер
        run: python3 -u scripts/steam_trailer_dl.py "${{ inputs.master_url }}" "${{ inputs.output_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: ${{ inputs.output_name }}
          if-no-files-found: error
          retention-days: 7
