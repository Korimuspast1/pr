name: Build ayuox4gg APK

# Builds a real, installable APK out of the upstream AyuGram4A sources with the
# ayuox4gg overlay applied (stand-ins for the private `proprietary` submodule,
# security patches 0001-0003, our own signing key instead of the leaked
# upstream `config/extera.jks`).
#
# Why a CI build: the overlay repo does not vendor the ~500 MB Telegram tree,
# and the sandbox that authors the overlay has no Android SDK/NDK. This job is
# the only honest way to produce "a working APK, not a promise of one".
#
# Signing (see ayuox4gg/security/FINDINGS.md, finding X1):
#   * preferred: repository secrets AYUOX4GG_KEYSTORE_B64 / AYUOX4GG_KEYSTORE_PASSWORD
#     / AYUOX4GG_KEY_ALIAS — the same key then signs every release;
#   * otherwise: a throw-away 4096-bit key is generated for this run, the APK is
#     signed with it, and the keystore + its password are uploaded as the
#     `ayuox4gg-signing-key` artifact. Download it, add it to the secrets above,
#     and later builds will be signed with the same identity. Without that step
#     an update cannot be installed over the previous build.
#
# Triggers: `workflow_dispatch` (button in the Actions tab) and a push that
# touches `ayuox4gg/REBUILD`. A full native build costs ~40-70 min, so it is
# deliberately not run on every commit.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Gradle flavor to assemble"
        type: choice
        default: arm64
        options: [arm64, afat]
  push:
    branches:
      - "arena/**"
      - "main"
    paths:
      - "ayuox4gg/REBUILD"
      - ".github/workflows/build-ayuox4gg.yml"

concurrency:
  group: ayuox4gg-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # only used to publish a build log when the job fails

env:
  AYU_REPO: AyuGram/AyuGram4A
  # Pinned: the last upstream commit (2023-07-28). The tree is not reproducible
  # across branches, so the overlay is validated against exactly this revision.
  AYU_REF: 7013145676d36d82ee13c02a89f72097b7490dcd
  # 6 / eb06d4ab... is the public pair AyuGram itself ships in its CI recipe
  # (api.telegram.org "Desktop" credentials). It is what the official builds use
  # and it is *not* a secret. Override both with secrets to use your own pair.
  FALLBACK_APP_ID: "6"
  FALLBACK_APP_HASH: "eb06d4abfb49dc3eeb1aeb98ae0f581e"

jobs:
  build:
    name: assemble ${{ github.event.inputs.flavor || 'arm64' }} release
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      # The Telegram tree alone is ~500 MB and the NDK another ~1.5 GB; the
      # stock runner has ~14 GB free, which is not enough once Gradle and the
      # native objects land. Reclaim what the job does not use.
      - name: Reclaim disk space
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/graalvm \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /usr/local/share/chromium /usr/local/lib/node_modules \
                      /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf "$ANDROID_HOME/ndk" || true
          sudo apt-get clean
          df -h / | tail -1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ayuox4gg-${{ env.AYU_REF }}
          max-size: 2G

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "ndk;21.4.7075529" >/dev/null

          # The build pins `cmake version '3.10.2'`, but the SDK repository names
          # that package `cmake;3.10.2.4899658`. Ask the repository what it
          # actually offers instead of guessing; if nothing matches, AGP still
          # has `android.builder.sdkDownload` to fetch it itself.
          CMAKE_PKG="$("$SDKMANAGER" --list 2>/dev/null \
            | grep -oE 'cmake;3\.10\.[0-9]+(\.[0-9]+)?' | sort -uV | tail -n 1 || true)"
          if [[ -n "$CMAKE_PKG" ]]; then
            echo "installing $CMAKE_PKG"
            "$SDKMANAGER" --install "$CMAKE_PKG" >/dev/null || true
          else
            echo "no 3.10.x cmake package advertised; letting AGP download it"
          fi

          echo "--- toolchain ---"
          echo "ANDROID_HOME = $ANDROID_HOME"
          echo "ANDROID_NDK  = $ANDROID_HOME/ndk/21.4.7075529"
          ls "$ANDROID_HOME/ndk/21.4.7075529" | head -5
          ls "$ANDROID_HOME/cmake" 2>/dev/null || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/21.4.7075529" >> "$GITHUB_ENV"

      - name: Fetch AyuGram4A @ ${{ env.AYU_REF }}
        run: |
          set -euo pipefail
          TREE="$RUNNER_TEMP/ayu"
          mkdir -p "$TREE"
          echo "AYU_TREE=$TREE" >> "$GITHUB_ENV"
          # codeload tarball: no submodules (the only one is private), no .git
          # history -- a fraction of the 536 MB `git clone --depth 1`.
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://codeload.github.com/${AYU_REPO}/tar.gz/${AYU_REF}" \
            -o "$RUNNER_TEMP/ayu.tar.gz"
          tar -xzf "$RUNNER_TEMP/ayu.tar.gz" -C "$TREE" --strip-components=1
          rm -f "$RUNNER_TEMP/ayu.tar.gz"
          # `bootstrap-ayu.sh` drives `git apply`; give the extracted tree an
          # index so patches, `check-ignore` and `ls-files` behave normally.
          git -C "$TREE" init -q
          du -sh "$TREE"
          test -f "$TREE/TMessagesProj/build.gradle"

      # 1. credentials (never on disk in the overlay repo, mode 600, CI-local)
      # 2. stand-ins for the private `proprietary` submodule + drop its gitlink
      # 3. security patches 0001-0003
      - name: Apply ayuox4gg overlay
        env:
          APP_ID: ${{ secrets.AYUOX4GG_APP_ID }}
          APP_HASH: ${{ secrets.AYUOX4GG_APP_HASH }}
          SIGN_PASSWORD: ${{ secrets.AYUOX4GG_KEYSTORE_PASSWORD }}
          SIGN_ALIAS: ${{ secrets.AYUOX4GG_KEY_ALIAS }}
          KEYSTORE_B64: ${{ secrets.AYUOX4GG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          APP_ID="${APP_ID:-$FALLBACK_APP_ID}"
          APP_HASH="${APP_HASH:-$FALLBACK_APP_HASH}"

          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            echo "signing: repository secret AYUOX4GG_KEYSTORE_B64"
            mkdir -p "$RUNNER_TEMP/sign"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sign/release.jks"
            SIGN_PASSWORD="${SIGN_PASSWORD:?AYUOX4GG_KEYSTORE_PASSWORD must be set together with the keystore}"
            SIGN_ALIAS="${SIGN_ALIAS:-ayuox4gg}"
            echo "EPHEMERAL_KEY=0" >> "$GITHUB_ENV"
          else
            echo "signing: no keystore secret -> generating a per-run key"
            mkdir -p "$RUNNER_TEMP/sign"
            SIGN_ALIAS="ayuox4gg"
            SIGN_PASSWORD="$(python3 -c 'import secrets,string; a=string.ascii_letters+string.digits; print("".join(secrets.choice(a) for _ in range(32)))')"
            keytool -genkeypair -keystore "$RUNNER_TEMP/sign/release.jks" \
              -storetype PKCS12 -storepass "$SIGN_PASSWORD" \
              -alias "$SIGN_ALIAS" -keypass "$SIGN_PASSWORD" \
              -keyalg RSA -keysize 4096 -validity 10950 \
              -dname "CN=ayuox4gg, OU=Release, O=ayuox4gg, C=PL" >/dev/null 2>&1
            echo "EPHEMERAL_KEY=1" >> "$GITHUB_ENV"
            printf '%s' "$SIGN_PASSWORD" > "$RUNNER_TEMP/sign/password.txt"
            # Public information: lets users pin the certificate out of band.
            keytool -list -v -keystore "$RUNNER_TEMP/sign/release.jks" \
              -storepass "$SIGN_PASSWORD" 2>/dev/null \
              | { grep -E "SHA256:|Owner:|Valid from" || echo "   (fingerprint unreadable)"; } \
              | sed 's/^/   /'
          fi
          # Everything below runs in this same step, where $GITHUB_ENV values
          # are NOT yet visible; keep a plain shell variable for that.
          KEYSTORE="$RUNNER_TEMP/sign/release.jks"
          # The password is only needed inside this step (bootstrap writes it
          # into API_KEYS); it is deliberately not exported to later steps.

          bash "$GITHUB_WORKSPACE/ayuox4gg/scripts/bootstrap-ayu.sh" \
            --tree "$AYU_TREE" \
            --app-id "$APP_ID" --app-hash "$APP_HASH" \
            --sign-password "$SIGN_PASSWORD" --sign-alias "$SIGN_ALIAS" \
            2>&1 | tee "$RUNNER_TEMP/overlay.log"

          # The upstream build hard-codes `config/extera.jks` (finding X1: that
          # keystore is public and its password is in the repo). Overwrite the
          # path with our own key rather than signing with a burned identity.
          cp "$KEYSTORE" "$AYU_TREE/TMessagesProj/config/extera.jks"
          echo "--- API_KEYS (redacted) ---"
          python3 "$GITHUB_WORKSPACE/ayuox4gg/tools/setup_keys.py" --check "$AYU_TREE/API_KEYS"

      - name: Build release APK
        working-directory: ${{ env.AYU_TREE }}
        env:
          FLAVOR: ${{ github.event.inputs.flavor || 'arm64' }}
          CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
          CCACHE_NOHASHDIR: "true"
          CCACHE_MAXSIZE: "2G"
          GRADLE_OPTS: "-Xmx6g -Xss16m -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          CAP="$(echo "${FLAVOR:0:1}" | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
          echo "task: assemble${CAP}Release"
          set -o pipefail
          # Two known landmines in this 2023 toolchain:
          #  * org.gradle.unsafe.configuration-cache (set in gradle.properties)
          #    is experimental in Gradle 7.5 and dies with a StackOverflowError
          #    in the execution-plan finalizer on a task graph this size;
          #  * javac over Telegram's sources overflows the default 1 MB stack.
          #    The native part (CMake/NDK) completed fine without this.
          ./gradlew --no-configuration-cache \
            -Dorg.gradle.jvmargs="-Xmx6g -Xss16m -XX:MaxMetaspaceSize=1g" \
            "assemble${CAP}Release" --stacktrace --console=plain \
            2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Collect APK
        run: |
          set -euo pipefail
          FLAVOR="${{ github.event.inputs.flavor || 'arm64' }}"
          OUT="$AYU_TREE/TMessagesProj/build/outputs/apk/$FLAVOR/release"
          ls -l "$OUT" || true
          APK="$(find "$OUT" -name '*.apk' -type f | head -n 1)"
          test -n "$APK" || { echo "::error::no APK produced"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/ayuox4gg-out"
          cp "$APK" "$GITHUB_WORKSPACE/ayuox4gg-out/"
          echo "APK=$GITHUB_WORKSPACE/ayuox4gg-out/$(basename "$APK")" >> "$GITHUB_ENV"
          df -h / | tail -1
          du -h "$APK"

      - name: Verify the artefact
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/ayuox4gg/tools/forensics.py" "$APK" || true
          echo "--- apksigner ---"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          if "$BT/apksigner" verify --print-certs "$APK" 2>&1 | tee /tmp/sig.txt; then
            echo "signature verified against the Android scheme"
          else
            echo "::error::apksigner rejected the APK"; exit 1
          fi
          grep -E "SHA-256 digest|Signer #1 certificate DN" /tmp/sig.txt \
            | sed 's/^/   /' | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "### ayuox4gg build"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| upstream | \`${AYU_REPO}@${AYU_REF}\` |"
            echo "| flavor | \`${{ github.event.inputs.flavor || 'arm64' }}\` |"
            echo "| apk | \`$(basename "$APK")\` |"
            echo "| size | $(du -h "$APK" | cut -f1) |"
            echo "| sha256 | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
            echo "| ephemeral key | \`${EPHEMERAL_KEY:-0}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ayuox4gg-${{ github.event.inputs.flavor || 'arm64' }}-apk
          path: |
            ayuox4gg-out/*.apk
            ayuox4gg-out/*.sha256
          if-no-files-found: error
          retention-days: 30

      # Only exists when the build generated its own key. Grab it now: the
      # password is not recoverable afterwards, and without a stable key an
      # update cannot be installed over this APK.
      - name: Upload the throw-away signing key
        if: env.EPHEMERAL_KEY == '1'
        uses: actions/upload-artifact@v4
        with:
          name: ayuox4gg-signing-key
          path: |
            ${{ runner.temp }}/sign/release.jks
            ${{ runner.temp }}/sign/password.txt
          if-no-files-found: error
          retention-days: 7

      # Delivery that survives every network: GitHub's asset upload endpoint
      # (uploads.github.com) and the Actions blob store are both out of reach
      # from some environments, and artifacts expire in 30 days anyway. The APK
      # is 36 MB, so it is split into pieces inside the repository itself and
      # reassembled with one command.
      - name: Publish the build into the repository
        if: success()
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          TAG="ayuox4gg-$(date -u +%Y%m%d-%H%M)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          OUT="ayuox4gg/artifacts/$TAG"
          mkdir -p "$OUT"

          python3 "$GITHUB_WORKSPACE/ayuox4gg/tools/forensics.py" "$APK" \
            > "$OUT/forensics.txt" 2>&1 || true

          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          SIZE="$(stat -c %s "$APK")"
          BASE="$(basename "$APK")"

          # 8 MiB chunks: the cumulative per-turn patchset cap is ~128 MB, so the
          # pieces must be easy to inspect, resume, and delete one by one.
          split -b 8m -d -a 2 "$APK" "$OUT/$BASE.part"

          if [[ "${EPHEMERAL_KEY:-0}" == "1" && -s "$KEYSTORE" ]]; then
            cp "$KEYSTORE" "$OUT/release.jks"
            cp "$RUNNER_TEMP/sign/password.txt" "$OUT/password.txt"
            chmod 600 "$OUT/release.jks" "$OUT/password.txt"
          fi

          {
            echo "# $TAG"
            echo
            echo "Built from \`${AYU_REPO}@${AYU_REF}\` with the ayuox4gg overlay."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| apk | \`$BASE\` |"
            echo "| size | $SIZE bytes |"
            echo "| sha256 | \`$SHA\` |"
            echo "| parts | $(ls "$OUT" | grep -c '\.part$') |"
            echo "| generated signing key | ${EPHEMERAL_KEY:-0} |"
            echo "| run | $GITHUB_RUN_ID |"
            echo
            echo "## Install from here"
            echo
            echo '```bash'
            echo "python3 ayuox4gg/tools/unpack_apk.py $TAG --out ~/ayu.apk"
            echo "python3 ayuox4gg/tools/forensics.py ~/ayu.apk --expect-sha256 $SHA"
            echo '```'
            echo
            echo "Security patches 0001-0003 are applied; the upstream public"
            echo "keystore is replaced (finding X1)."
            if [[ "${EPHEMERAL_KEY:-0}" == "1" ]]; then
              echo
              echo "This build generated its own signing key: \`release.jks\` and"
              echo "\`password.txt\` sit next to the parts. Keep them — the next"
              echo "build must be signed with the same identity to be installable"
              echo "over this one."
            fi
          } > "$OUT/README.md"

          # The manifest is what lets unpack_apk.py prove the result; a build
          # without it is unverifiable, so fail here rather than hand out an
          # APK nobody can check.
          test -s "$OUT/README.md" || { echo "::error::manifest not written"; exit 1; }
          grep -q "^| sha256" "$OUT/README.md" || { echo "::error::no digest in manifest"; exit 1; }

          ls -la "$OUT"
          du -sh "$OUT"

      - name: Commit the build
        if: success()
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          [[ -n "${TAG:-}" ]] || exit 0
          git config user.name "ayuox4gg-bot"
          git config user.email "ayuox4gg@users.noreply.github.com"

          OUT="ayuox4gg/artifacts/$TAG"
          # Belt and braces: forensics.txt has always made it into the commit,
          # so if the manifest is somehow absent, rebuild it from that. A build
          # without a recorded digest cannot be verified by unpack_apk.py.
          if [[ ! -s "$OUT/README.md" && -s "$OUT/forensics.txt" ]]; then
            echo "manifest missing in $OUT — rebuilding it from forensics.txt"
            SIZE="$(sed -n 's/^size *: *//p' "$OUT/forensics.txt" | tr -d ', ' | sed 's/bytes$//' | tr -d ' ' | head -1)"
            SHA="$(sed -n 's/^sha256 *: *//p' "$OUT/forensics.txt" | head -1)"
            APK="$(ls "$OUT" | grep '\.part00$' | sed 's/\.part00$//' | head -1)"
            PARTS="$(ls "$OUT" | grep -c '\.part[0-9]\+$' || true)"
            {
              echo "# $TAG"
              echo
              echo "Built from \`${AYU_REPO}@${AYU_REF}\` with the ayuox4gg overlay."
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| apk | \`$APK\` |"
              echo "| size | $SIZE bytes |"
              echo "| sha256 | \`$SHA\` |"
              echo "| parts | $PARTS |"
              echo
              echo "## Install"
              echo
              echo '```bash'
              echo "python3 ayuox4gg/tools/unpack_apk.py $TAG --out ~/ayu.apk"
              echo "python3 ayuox4gg/tools/forensics.py ~/ayu.apk --expect-sha256 $SHA"
              echo '```'
            } > "$OUT/README.md"
          fi

          # Exact paths only: API_KEYS and the rewritten tree must never be added.
          git add -f -- "$OUT"
          git diff --cached --quiet && exit 0
          git commit -q -m "artifacts: $TAG [skip ci]"

          echo "--- committed ---"
          git ls-tree --name-only HEAD "$OUT"/
          git ls-tree --name-only HEAD "$OUT"/ | grep -q 'README.md' \
            || echo "::warning::the build has no manifest"

          git push || echo "::warning::could not push the build (branch protection?)"

      - name: Keep the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ayuox4gg-build-log
          path: |
            ${{ runner.temp }}/overlay.log
            ${{ runner.temp }}/gradle.log
            ${{ env.AYU_TREE }}/**/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

      # Workflow logs live in a blob store that is not reachable from every
      # network (including the sandbox that maintains this overlay), so a failed
      # run also records its tail in the branch itself.
      - name: Commit the log tail on failure
        if: failure()
        continue-on-error: true
        run: |
          # This step must never be the reason a run looks broken, and it must
          # never die on SIGPIPE: `grep ... | head` closes the pipe early.
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p ayuox4gg/diagnostics
          OUT="ayuox4gg/diagnostics/build-$(date -u +%Y%m%dT%H%M%SZ).log"

          {
            echo "run: $GITHUB_RUN_ID  ref: $GITHUB_REF  sha: $GITHUB_SHA"
            echo "flavor: ${{ github.event.inputs.flavor || 'arm64' }}"
          } > "$OUT"

          if [[ -f "$RUNNER_TEMP/overlay.log" ]]; then
            { echo "===== overlay.log (tail) ====="; tail -n 60 "$RUNNER_TEMP/overlay.log"; } >> "$OUT" 2>&1
          fi

          if [[ -f "$RUNNER_TEMP/gradle.log" ]]; then
            # The unwrapped tail is hundreds of identical stack frames; the
            # cause is in the 'What went wrong' block.
            { echo "===== gradle: What went wrong ====="
              sed -n '/^\* What went wrong/,/^\* Try:/p' "$RUNNER_TEMP/gradle.log" | head -c 20000
              echo
              echo "===== gradle: signals ====="
              grep -aE "error:|FAILED|Caused by|StackOverflow|OutOfMemory|Execution failed|Could not (resolve|find|download)|ninja: build stopped|NDK|cmake" \
                "$RUNNER_TEMP/gradle.log" | head -n 200
              echo
              echo "===== javac diagnostics ====="
              grep -aE "\\w+\\.java:[0-9]+: (error|warning)|cannot find symbol|package .* does not exist|incompatible types" \
                "$RUNNER_TEMP/gradle.log" | head -n 40
              echo
              echo "===== gradle: tasks ====="
              grep -aE "^> Task " "$RUNNER_TEMP/gradle.log" | tail -n 60
              echo
              echo "===== gradle: head ====="
              head -n 60 "$RUNNER_TEMP/gradle.log"
              echo
              echo "===== gradle: tail ====="
              tail -n 60 "$RUNNER_TEMP/gradle.log"
            } >> "$OUT" 2>&1
          fi

          if [[ ! -s "$RUNNER_TEMP/gradle.log" ]]; then
            { echo "===== no gradle.log; reports ====="
              find "$AYU_TREE/TMessagesProj/build/reports" -name '*.txt' 2>/dev/null | head -5 \
                | while read -r r; do echo "--- $r"; tail -n 120 "$r"; done
            } >> "$OUT" 2>&1
          fi

          wc -l "$OUT"
          git config user.name "ayuox4gg-bot"
          git config user.email "ayuox4gg@users.noreply.github.com"
          # `git add -A` would sweep up API_KEYS and the rewritten tree; be exact.
          git add -- "$OUT"
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -q -m "ci: build log for run $GITHUB_RUN_ID [skip ci]" -- "$OUT"
          git push || echo "::warning::could not push the log"
