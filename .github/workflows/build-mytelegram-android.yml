name: build-mytelegram-android

on:
  workflow_dispatch:
    inputs:
      server_ip:
        description: "IPv4/IPv6 address used by the APK to reach MyTelegram"
        required: true
        default: "192.168.1.100"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;21.4.7075529"

      - name: Build MyTelegram Android client
        env:
          MYTELEGRAM_IP: ${{ inputs.server_ip }}
        run: ./mytelegram-local/build-client.sh "$MYTELEGRAM_IP"

      - name: Check APK output
        run: |
          find mytelegram-local/build/apk -type f -name '*.apk' -print
          test -n "$(find mytelegram-local/build/apk -type f -name '*.apk' -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: mytelegram-android-${{ inputs.server_ip }}
          path: mytelegram-local/build/apk/*.apk
          if-no-files-found: error
