name: Dolphy APK

on:
  push:
    branches: [arena/a583a263-pr]
    paths:
      - dolphy-changes.patch
      - .github/workflows/dolphy-apk.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dolphy-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout session repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Dolphy-App
        uses: actions/checkout@v4
        with:
          repository: unvoiddd/Dolphy-App
          ref: db41e0b72a0090823595462bafd65f35eb57598f
          path: dolphy-src

      - name: Apply changes
        working-directory: dolphy-src
        run: git apply --whitespace=nowarn "$GITHUB_WORKSPACE/dolphy-changes.patch"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" || true

      - name: Build APK
        working-directory: dolphy-src
        run: |
          WRAPPER="java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain"
          $WRAPPER --no-daemon assembleRelease -x lintVitalRelease || $WRAPPER --no-daemon assembleDebug

      - name: Collect APK
        run: |
          set -euo pipefail
          REL=$(find dolphy-src/app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -n 1 || true)
          DBG=$(find dolphy-src/app/build/outputs/apk/debug -name '*.apk' 2>/dev/null | head -n 1 || true)
          APK="${REL:-$DBG}"
          if [ -z "$APK" ]; then echo "No APK produced"; exit 1; fi
          echo "Built: $APK"
          ls -lh "$APK"
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' dolphy-src/app/build.gradle.kts | head -n 1)
          [ -n "$VERSION" ] || VERSION=latest
          mkdir -p release
          rm -f release/*.apk
          cp "$APK" "release/Dolphy-${VERSION}.apk"
          ls -lh release/

      - name: Publish APK to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/*.apk
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "ci: publish Dolphy APK [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:refs/heads/arena/a583a263-pr; then
              exit 0
            fi
            echo "push failed, rebasing and retrying ($i)"
            git fetch origin refs/heads/arena/a583a263-pr
            git rebase FETCH_HEAD || true
            sleep 15
          done
          exit 1

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(ls release/Dolphy-*.apk | head -n 1)
          NAME=$(basename "$APK" .apk)
          VER=${NAME#Dolphy-}
          TAG="v${VER}"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          NOTES="Dolphy ${VER} — CI release build (minSdk 26, R8).

          SHA256: \`${SHA}\`"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Dolphy ${VER}" \
              --notes "$NOTES"
          fi
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$APK")"
