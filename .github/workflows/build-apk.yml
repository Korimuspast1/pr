name: Build Zombie Town APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/*']
    paths:
      - 'zombie-town/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zombie-town
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: zombie-town/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into Android project
        run: npx cap sync

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zombie-town-debug-apk
          path: zombie-town/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
