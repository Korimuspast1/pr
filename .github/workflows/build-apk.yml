name: Build Zombie Town APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/*']
    tags: ['v*']
    paths:
      - 'zombie-town/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zombie-town
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: zombie-town/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into Android project
        run: npx cap sync

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zombie-town-debug-apk
          path: zombie-town/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

  release:
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: zombie-town-debug-apk
          path: dist

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: dist/app-debug.apk
          name: "Zombie Town ${{ github.ref_name }}"
          body: |
            ## 🏘️🧟 Cozy Pixel Zombie Town ${{ github.ref_name }}

            Пиксельный градостроительный симулятор выживания для Android.

            - Город **сам заселяется и растёт**: люди приходят, строят домики, многоэтажки и небоскрёбы
            - Жители **адаптируются**: крадутся, прячутся в домах, дерутся, набираются опыта
            - Зомби **ищут людей**: видят, слышат шум, проверяют дома и последний след
            - Спавн зомби **в любой момент**: ×1, ×5, орда ×20 или полная вспышка
            - Защита: стены, башни, турели, тревога; ремонт и перестройка после атаки
            - Офлайн, без интернета и разрешений. Android 7.0+ (API 24), landscape

            ### Установка
            Скачай `app-debug.apk`, установи на телефон (разреши установку из неизвестных источников) и играй!
