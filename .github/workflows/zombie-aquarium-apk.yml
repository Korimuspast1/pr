name: Build Zombie Aquarium APK

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'zombie-aquarium/**'
      - '.github/workflows/zombie-aquarium-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-zombie-aquarium:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run unit & 650-tick simulation stress tests
        working-directory: zombie-aquarium
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Android APK (Debug)
        working-directory: zombie-aquarium
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Copy & verify APK
        working-directory: zombie-aquarium
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/ZombieAquarium.apk
          ls -lh release/ZombieAquarium.apk

      - name: Upload ZombieAquarium.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZombieAquarium-APK
          path: zombie-aquarium/release/ZombieAquarium.apk

      - name: Commit compiled APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zombie-aquarium/release/ZombieAquarium.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build compiled ZombieAquarium.apk [skip ci]"
            git checkout -- .
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
