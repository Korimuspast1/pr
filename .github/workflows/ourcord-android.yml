name: Build OurCord Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ourcord-manager

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: ourcord-manager/**/*.gradle*

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Normalize artifact name
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk release/OurCord-Manager-1.3.0.apk
          sha256sum release/OurCord-Manager-1.3.0.apk > release/OurCord-Manager-1.3.0.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OurCord-Manager-1.3.0
          path: ourcord-manager/release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ourcord-v1.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload ourcord-v1.3.0 release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create ourcord-v1.3.0 release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "OurCord Manager 1.3.0" \
              --notes "OurCord Manager for Android 9+. Downloads supported Discord split APKs on-device, patches with LSPatch, injects the open-source runtime module, signs locally, and opens Android's installer. Discord APK is not redistributed. This manager build uses a development signing identity; retain it for updates. Modified clients may violate Discord Terms of Service."
          fi
