name: Build OurCord Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0ecf6-pr
    paths:
      - "ourcord-manager/**"
      - ".github/workflows/ourcord-android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ourcord-manager

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: ourcord-manager/**/*.gradle*

      - name: Install Android SDK components
        run: |
          echo "y" | sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Normalize artifact name
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk release/OurCord-Manager-1.3.0.apk
          sha256sum release/OurCord-Manager-1.3.0.apk > release/OurCord-Manager-1.3.0.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OurCord-Manager-1.3.0
          path: ourcord-manager/release/*
          if-no-files-found: error
          retention-days: 30
