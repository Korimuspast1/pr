name: ytdl-bot

# живёт сменами по ~5.5 часа, потом сама поднимается заново.
# у github actions один job максимум 6 часов — поэтому расписание, а не «вечный» процесс.
on:
  workflow_dispatch:
  push:
    branches: ['main', 'arena/**']
    paths: ['ytdl-bot/**', '.github/workflows/ytdl-bot.yml']
  schedule:
    - cron: '0 */6 * * *'

# лок на ветку, а не общий: иначе живой бот держит очередь и деплой фикса
# ждёт до 5.5 часов. новый прогон должен вытеснять старый.
concurrency:
  group: ytdl-bot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: кэш загрузок pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ytdl-${{ hashFiles('ytdl-bot/requirements.txt') }}

      - name: ставим зависимости
        run: pip install -r ytdl-bot/requirements.txt

      - name: ffmpeg (нужен для слияния дорожек и сжатия)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: самопроверка логики без сети
        run: python ytdl-bot/bot.py --selftest

      - name: есть ли обход проверки «ты бот» (не обязательно)
        env:
          YTDL_COOKIES: ${{ secrets.YTDL_COOKIES }}
          YTDL_PROXY: ${{ secrets.YTDL_PROXY }}
        run: |
          if [ -n "$YTDL_COOKIES" ]; then
            echo "cookies: заданы — ютуб должен работать"
          else
            echo "::warning title=ютуб может не работать::YTDL_COOKIES не задан."
            echo "на датацентровом IP github ютуб часто просит подтвердить, что ты не бот."
            echo "лечится: settings -> secrets -> actions -> new repository secret YTDL_COOKIES"
          fi
          [ -n "$YTDL_PROXY" ] && echo "прокси: задан" || echo "прокси: не задан (не обязателен)"

      - name: проверка токена
        id: token
        env:
          YTDL_BOT_TOKEN: ${{ secrets.YTDL_BOT_TOKEN }}
        run: |
          if [ -z "$YTDL_BOT_TOKEN" ]; then
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::error title=нужен токен::секрет YTDL_BOT_TOKEN не задан."
            echo "settings -> secrets and variables -> actions -> new repository secret"
            echo "name: YTDL_BOT_TOKEN, value: токен от @BotFather"
          else
            echo "have=1" >> "$GITHUB_OUTPUT"
          fi

      - name: запускаем бота
        if: steps.token.outputs.have == '1'
        working-directory: ytdl-bot
        env:
          YTDL_BOT_TOKEN: ${{ secrets.YTDL_BOT_TOKEN }}
          YTDL_COOKIES: ${{ secrets.YTDL_COOKIES }}
          YTDL_PROXY: ${{ secrets.YTDL_PROXY }}
        run: python -u bot.py
