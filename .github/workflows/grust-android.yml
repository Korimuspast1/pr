name: Build Грусть APK

# Builds the "Грусть" Android app (grust-android/). The runner has the Android SDK and a JDK, which
# is what makes the APK buildable at all: the machine the code is written on has neither, so the
# artifact is produced here and published to a release.
#
# The second job here runs the APK on an emulator and walks through every screen. It is in this
# file rather than in a workflow of its own because a workflow_run trigger only fires once the
# file exists on the default branch, and a self-triggered workflow_dispatch needs an Actions token
# the automation that maintains this repository does not have.
#
# Two conventions in this file come from the other Android jobs in this repository:
#   * anything worth knowing is printed as ::notice / ::error, because the run logs are not
#     downloadable from where the project is maintained and annotations are served by the API;
#   * the SDK is installed by tools/ci-android-sdk.sh rather than by a third-party action.

on:
  push:
    branches: [main]
    paths:
      - 'grust-android/**'
      - '.github/workflows/grust-android.yml'
  pull_request:
    paths:
      - 'grust-android/**'
      - '.github/workflows/grust-android.yml'
  workflow_dispatch:

permissions:
  contents: write   # only used to attach the APK to a release on a tag
  pull-requests: write

concurrency:
  group: grust-android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  COMPILE_SDK: '37'

jobs:
  build:
    name: Tests and APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grust-android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        run: bash tools/ci-android-sdk.sh

      - name: Unit tests
        run: bash tools/ci-gradle.sh 'testReleaseUnitTest|testRelease|test'

      - name: Assemble the release APK
        run: bash tools/ci-gradle.sh 'assembleRelease|assemble'

      - name: Annotate Kotlin errors
        if: failure()
        run: |
          set -uo pipefail
          grep -E '^e: ' ../gradle.log 2>/dev/null | head -80 |
            sed -E 's|^e: file://([^:]+):([0-9]+):([0-9]+) (.*)$|::error file=\1,line=\2,col=\3::\4|' || true
          grep -E '^(\* What went wrong|Execution failed|A problem occurred)' ../gradle.log 2>/dev/null |
            head -10 | sed -E 's|^(.*)$|::error::\1|' || true

      - name: Name the artifact
        run: |
          set -euo pipefail
          version=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)
          found=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$found" ]; then
            echo "::error::no APK under app/build/outputs/apk/release"
            find app/build/outputs -type f 2>/dev/null | head -30
            exit 1
          fi
          mkdir -p dist
          cp "$found" "dist/Grust-${version}.apk"
          # A checksum next to the file, so whoever downloads it can tell it arrived intact.
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "::notice title=APK::dist/Grust-${version}.apk ($(du -h "dist/Grust-${version}.apk" | cut -f1))"

      - uses: actions/upload-artifact@v5
        with:
          name: Grust-APK
          path: |
            grust-android/dist/*.apk
            grust-android/dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish the APK to a rolling release
        # A workflow artifact needs authentication to download; a release asset does not. Every
        # build of this workflow, from any branch, replaces the same two files, so there is always
        # one plain link to the newest APK.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)
          tag=grust-apk
          notes="Дневник настроения, дыхательные практики и статистика. Приложение работает офлайн: без разрешений и без сети.

          APK подписан debug-ключом: годится для ручной установки (нужно разрешить установку из неизвестных источников), но не для Google Play.

          Проверить файл: sha256sum -c SHA256SUMS.txt"
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$tag" --repo "${{ github.repository }}" \
              --title "Грусть — свежий APK" \
              --notes "$notes"
          fi
          gh release upload "$tag" dist/*.apk dist/SHA256SUMS.txt --clobber \
            --repo "${{ github.repository }}"
          echo "::notice title=Release::Grust-${version}.apk at /releases/tag/$tag"

      - name: Attach the APK to a release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/*.apk dist/SHA256SUMS.txt \
            --title "Грусть ${GITHUB_REF_NAME}" \
            --notes "Дневник настроения, дыхание и статистика. APK подписан debug-ключом - для установки вручную." \
            --repo "${{ github.repository }}"

  smoke:
    name: Emulator smoke test
    # A failed build has nothing to smoke; a successful one is exactly what this job is for.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JAVA_VERSION: '17'
      COMPILE_SDK: '37'
      BRANCH: ${{ github.head_ref || github.ref_name }}
    defaults:
      run:
        working-directory: grust-android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        run: bash tools/ci-android-sdk.sh

      - name: Build the debug APK
        # The debug variant is what the release build was signed as, but with its own application
        # id, so an already installed copy of the app is not overwritten by the test run.
        run: bash tools/ci-gradle.sh 'assembleDebug'

      - name: Enable KVM
        # Without KVM the x86_64 emulator is unusably slow; this is the rule the other Android jobs
        # in this repository use.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Walk through the app on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: grust-android
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          emulator-boot-timeout: 1500
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          # One `bash` call to a file in the repository rather than an inline script: the action
          # runs `script` with /bin/sh, and multiline shell inside YAML hides its quoting mistakes
          # until a runner has booted an emulator to discover them.
          # The path is absolute: the step has working-directory: grust-android, so a path
          # relative to the repository root would not resolve (exit 127, as the first fixed run did).
          script: bash "$GITHUB_WORKSPACE/grust-android/tools/run-smoke.sh"

      - name: Show what the emulator run saw
        # The run logs of this repository cannot be downloaded from where it is maintained, so
        # whatever the script reported is turned into annotations here, where the API serves it.
        if: always()
        run: |
          set -uo pipefail
          LOG="$GITHUB_WORKSPACE/smoke.log"
          if [ ! -f "$LOG" ]; then
            echo "::error title=Smoke::no smoke.log at all - the emulator script never started"
            exit 0
          fi
          ls -l "$GITHUB_WORKSPACE/screenshots-capture" 2>/dev/null || echo "no screenshots directory"
          # Each line becomes its own annotation; the script's own ::error lines are passed through.
          head -c 20000 "$LOG" | while IFS= read -r line; do
            case "$line" in
              ::*) echo "$line" ;;
              *) echo "::notice title=Smoke log::$(printf '%s' "$line" | cut -c1-900)" ;;
            esac
          done

      - name: Commit the screenshots
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CAPTURE="$GITHUB_WORKSPACE/screenshots-capture"
          if [ -z "$(ls -A "$CAPTURE" 2>/dev/null)" ]; then
            echo "::notice title=Smoke::no screenshots to commit"
            exit 0
          fi
          rm -rf screenshots && mkdir -p screenshots
          cp "$CAPTURE"/*.png screenshots/
          ls -l screenshots | sed -E 's|^(.*)$|::notice title=Screenshot::\1|'
          git add -f screenshots
          if git diff --cached --quiet; then
            echo "::notice title=Smoke::screenshots unchanged"
            exit 0
          fi
          git commit -m "CI: screenshots of the app on API 34 [skip ci]"
          # The checkout of a pull request is a merge commit, so HEAD is not a fast-forward of the
          # branch; the commit is rebuilt on top of the branch tip instead.
          git fetch --no-tags origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" || true
          if git reset --soft "origin/${BRANCH}" 2>/dev/null; then
            git commit -q -m "CI: screenshots of the app on API 34 [skip ci]"
          else
            echo "::notice title=Smoke::no origin/${BRANCH} to rebuild on, pushing HEAD as is"
          fi
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "::notice title=Smoke::screenshots committed to ${BRANCH}"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Grust-screenshots
          path: |
            ${{ github.workspace }}/screenshots-capture/*.png
            ${{ github.workspace }}/smoke.log
          if-no-files-found: ignore
