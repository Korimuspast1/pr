name: Build Грусть APK

# Builds the "Грусть" Android app (grust-android/). The runner has the Android SDK and a JDK, which
# is what makes the APK buildable at all: the machine the code is written on has neither, so the
# artifact is produced here and attached to a GitHub Release.
#
# Two conventions in this file come from the other Android jobs in this repository:
#   * anything worth knowing is printed as ::notice / ::error, because the run logs are not
#     downloadable from where the project is maintained and annotations are served by the API;
#   * the SDK is installed by tools/ci-android-sdk.sh rather than by a third-party action.

on:
  push:
    branches: [main]
    paths:
      - 'grust-android/**'
      - '.github/workflows/grust-android.yml'
  pull_request:
    paths:
      - 'grust-android/**'
      - '.github/workflows/grust-android.yml'
  workflow_dispatch:
    inputs:
      smoke:
        description: 'Только прогон на эмуляторе (APK уже собран)'
        type: boolean
        default: false

permissions:
  contents: write   # used to attach the APK to a release and to commit the screenshots
  actions: write    # the build job asks for the smoke job through workflow_dispatch
  pull-requests: write

concurrency:
  group: grust-android-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  COMPILE_SDK: '37'

jobs:
  build:
    name: Tests and APK
    if: ${{ inputs.smoke != true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grust-android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        run: bash tools/ci-android-sdk.sh

      - name: Unit tests
        run: bash tools/ci-gradle.sh 'testReleaseUnitTest|testRelease|test'

      - name: Assemble the release APK
        run: bash tools/ci-gradle.sh 'assembleRelease|assemble'

      - name: Annotate Kotlin errors
        if: failure()
        run: |
          set -uo pipefail
          grep -E '^e: ' ../gradle.log 2>/dev/null | head -80 |
            sed -E 's|^e: file://([^:]+):([0-9]+):([0-9]+) (.*)$|::error file=\1,line=\2,col=\3::\4|' || true
          grep -E '^(\* What went wrong|Execution failed|A problem occurred)' ../gradle.log 2>/dev/null |
            head -10 | sed -E 's|^(.*)$|::error::\1|' || true

      - name: Name the artifact
        run: |
          set -euo pipefail
          version=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)
          found=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$found" ]; then
            echo "::error::no APK under app/build/outputs/apk/release"
            find app/build/outputs -type f 2>/dev/null | head -30
            exit 1
          fi
          mkdir -p dist
          cp "$found" "dist/Grust-${version}.apk"
          # A checksum next to the file, so whoever downloads it can tell it arrived intact.
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "::notice title=APK::dist/Grust-${version}.apk ($(du -h "dist/Grust-${version}.apk" | cut -f1))"

      - uses: actions/upload-artifact@v5
        with:
          name: Grust-APK
          path: |
            grust-android/dist/*.apk
            grust-android/dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish the APK to a rolling release
        # A workflow artifact needs authentication to download; a release asset does not. Every
        # build of this workflow, from any branch, replaces the same two files, so there is always
        # one plain link to the newest APK.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)
          tag=grust-apk
          notes="Дневник настроения, дыхательные практики и статистика. Приложение работает офлайн: без разрешений и без сети.

          APK подписан debug-ключом: годится для ручной установки (нужно разрешить установку из неизвестных источников), но не для Google Play.

          Проверить файл: sha256sum -c SHA256SUMS.txt"
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$tag" --repo "${{ github.repository }}" \
              --title "Грусть — свежий APK" \
              --notes "$notes"
          fi
          gh release upload "$tag" dist/*.apk dist/SHA256SUMS.txt --clobber \
            --repo "${{ github.repository }}"
          echo "::notice title=Release::Grust-${version}.apk at /releases/tag/$tag"

      - name: Kick off the emulator smoke test
        # workflow_dispatch is the only trigger the smoke job listens to, and a pull request from a
        # fork could not use this token anyway - which is why this lives here and not in that job.
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run grust-android.yml --ref "${GITHUB_REF_NAME}" \
            -f smoke=true --repo "${{ github.repository }}"
          echo "::notice title=Smoke::requested on ${GITHUB_REF_NAME}"

      - name: Attach the APK to a release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/*.apk dist/SHA256SUMS.txt \
            --title "Грусть ${GITHUB_REF_NAME}" \
            --notes "Дневник настроения, дыхание и статистика. APK подписан debug-ключом - для установки вручную." \
            --repo "${{ github.repository }}"

  smoke:
    name: Emulator smoke test
    # Started by the build job above through workflow_dispatch (with -f smoke=true), so that it runs
    # on a push to any branch without the workflow having to listen to every push.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: grust-android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        run: bash tools/ci-android-sdk.sh

      - name: Build the debug APK
        run: bash tools/ci-gradle.sh 'assembleDebug'

      - name: Enable KVM
        # Without KVM the x86_64 emulator is unusably slow; this is the rule the other Android jobs
        # in this repository use.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Walk through the app on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: grust-android
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          emulator-boot-timeout: 1500
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          script: |
            set -o pipefail
            apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
            bash tools/ci-smoke.sh "$apk" ../screenshots-capture | tee ../smoke.log

      - name: Commit the screenshots
        if: always()
        continue-on-error: true
        env:
          GITHUB_REF_NAME_SAFE: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A flat copy with fixed names is easier to link from the README than a timestamped tree.
          rm -rf repo-screens && mkdir -p repo-screens
          for f in ../screenshots-capture/*.png; do
            [ -f "$f" ] && cp "$f" "repo-screens/$(basename "$f")"
          done
          ls -l repo-screens || true
          if [ -n "$(ls -A repo-screens 2>/dev/null)" ]; then
            git -C .. add -f grust-android/repo-screens
            if ! git -C .. diff --cached --quiet; then
              git -C .. commit -m "CI: screenshots of the app on API 34 [skip ci]"
              git -C .. push origin "HEAD:${GITHUB_REF_NAME_SAFE}" || true
            fi
          fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Grust-screenshots
          path: |
            screenshots-capture/*.png
            smoke.log
          if-no-files-found: ignore

      - name: Say what happened
        if: failure()
        run: |
          echo "::error title=Smoke::the run failed, see the artifact Grust-screenshots"
