name: Build VersionShelf APK

on:
  push:
    branches: [arena/01a0ec89-pr]
    paths:
      - 'android-versionshelf/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-versionshelf
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already includes Android command-line tools. Avoid a second SDK bootstrap.
      - name: Install Android build platform
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: versionshelf-debug-apk
          path: android-versionshelf/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
