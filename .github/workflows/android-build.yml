name: Build VersionShelf APK

on:
  push:
    # Current development branch and main both publish a GitHub pre-release after a successful build.
    branches: [arena/01a0ec89-pr, main]
    paths:
      - 'android-versionshelf/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  # A successful build is published as a GitHub pre-release with a direct APK asset.
  contents: write

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-versionshelf
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools and Platform 35
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/android-tools.zip" \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          } >> "$GITHUB_ENV"
      - name: Assemble debug APK
        run: |
          set +e
          ./gradlew --no-daemon :app:assembleDebug > build.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            cat build.log
            grep -E '(^e: |^FAILURE:| error:|\* What went wrong:)' build.log | tail -n 20 | while IFS= read -r line; do
              echo "::error title=Gradle build::$line"
            done
            exit "$result"
          fi
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: versionshelf-build-log
          path: android-versionshelf/build.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: versionshelf-debug-apk
          path: android-versionshelf/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub pre-release with direct APK
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/arena/01a0ec89-pr' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: versionshelf-debug-${{ github.run_number }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TITLE="VersionShelf debug build #${{ github.run_number }}"
          NOTES="Automated debug APK from commit $GITHUB_SHA. It is signed with Android's debug key and is for testing/private installation, not Google Play distribution."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK#versionshelf-debug.apk" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK#versionshelf-debug.apk" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi
