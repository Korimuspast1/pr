name: Build Liquid Glass Lab APK

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/2dafe562-pr"
    paths:
      - "liquidglass/**"
      - ".github/workflows/liquidglass-build.yml"

permissions:
  contents: write

concurrency:
  group: liquidglass-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assemble + verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="$ANDROID_HOME"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="$HOME/android-sdk"; fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -sSLo /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Check the shader is in sync with its generated Java copy
        working-directory: liquidglass
        run: python3 tools/sync_shader.py --check

      - name: Compile the shipped AGSL with CPU Skia
        working-directory: liquidglass
        continue-on-error: true
        run: |
          python3 -m pip install --quiet skia-python numpy
          python3 tools/verify_shader.py

      - name: Build, sign and verify APK (aapt2 + javac + d8 + apksigner)
        working-directory: liquidglass
        run: |
          set -o pipefail
          python3 tools/build_apk.py --out "$GITHUB_WORKSPACE/release/LiquidGlassLab.apk" 2>&1 | tee build.log

      - name: Verify signature and manifest
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/apksigner" verify --verbose release/LiquidGlassLab.apk
          "$BT/aapt2" dump badging release/LiquidGlassLab.apk | head -n 20

      - name: Upload APK + build log
        uses: actions/upload-artifact@v4
        with:
          name: liquidglass-lab-apk
          path: |
            release/LiquidGlassLab.apk
            liquidglass/build.log
          if-no-files-found: error

      - name: Commit the APK to release/
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/LiquidGlassLab.apk
          if git diff --cached --quiet; then echo "APK unchanged"; exit 0; fi
          git commit -m "CI: build Liquid Glass Lab APK [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
