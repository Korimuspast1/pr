name: Validate Firestore rules

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
      - "main"
    paths:
      - "firebase/firestore.rules"
      - "firebase/firebase.json"
      - ".github/workflows/validate-firestore-rules.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile rules in Firestore emulator
        working-directory: firebase
        run: |
          set -o pipefail
          npx --yes firebase-tools@latest emulators:exec \
            --only firestore \
            --project demo-visaroom \
            "true" 2>&1 | tee "$GITHUB_WORKSPACE/rules-validation-output.txt"

      - name: Commit validation log on failure
        if: failure()
        run: |
          mkdir -p build-transfer
          tail -n 300 rules-validation-output.txt > build-transfer/rules-validation-log.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-transfer/rules-validation-log.txt
          git diff --cached --quiet || git commit -m "CI: Firestore rules validation log [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
