name: kem passive audit 2 (api + cors)

# Пассивная проверка API-поверхности kem-rp.com и CORS-конфигурации.
# Все запросы — обычные GET/OPTIONS без куки и без авторизации.
on:
  push:
    paths:
      - '.github/workflows/kem-audit-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: collect
        run: |
          set -u
          D=relay-out/kem2
          mkdir -p "$D"
          UA='Mozilla/5.0 (compatible; KemAudit/1.0; owner-authorized passive review)'

          echo "### A. api.kem-rp.com response headers (root + documented endpoints)" > "$D/api-headers.txt"
          for u in https://api.kem-rp.com/ https://api.kem-rp.com/v1/ https://api.kem-rp.com/v1/auth/check.php; do
            echo "== GET $u" >> "$D/api-headers.txt"
            curl -sS -o /tmp/a -D - --max-time 20 -A "$UA" -H 'Accept: application/json' "$u" \
              >> "$D/api-headers.txt" 2>&1
            echo "-- body: $(head -c 200 /tmp/a | tr -d '\r\n')" >> "$D/api-headers.txt"
            echo >> "$D/api-headers.txt"
          done

          echo "### B. CORS reflection matrix on api" > "$D/cors-api.txt"
          for origin in 'https://evil.example' 'https://kem-rp.com' 'null'; do
            echo "== Origin: $origin (simple GET)" >> "$D/cors-api.txt"
            curl -sS -o /dev/null -D - --max-time 20 -A "$UA" \
              -H "Origin: $origin" -H 'Accept: application/json' \
              https://api.kem-rp.com/v1/auth/check.php \
              | grep -iE '^access-control|^vary' >> "$D/cors-api.txt" 2>&1 \
              || echo "(no CORS headers)" >> "$D/cors-api.txt"
          done

          echo "== Preflight OPTIONS (Origin evil, POST + x-requested-with)" >> "$D/cors-api.txt"
          curl -sS -o /dev/null -D - -X OPTIONS --max-time 20 -A "$UA" \
            -H 'Origin: https://evil.example' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: x-requested-with,content-type' \
            https://api.kem-rp.com/v1/auth/login.php \
            | grep -iE '^HTTP|^access-control|^vary|^allow' >> "$D/cors-api.txt" 2>&1

          echo "### C. TLS on api.kem-rp.com" > "$D/api-tls.txt"
          echo | timeout 25 openssl s_client -connect api.kem-rp.com:443 -servername api.kem-rp.com 2>&1 \
            | openssl x509 -noout -subject -issuer -dates -ext subjectAltName >> "$D/api-tls.txt" 2>&1

          echo "### D. Where do unknown paths go? (302 destination)" > "$D/missing.txt"
          for p in .env nope-page-zzz security.txt; do
            echo "== /$p" >> "$D/missing.txt"
            curl -sS -o /dev/null --max-time 20 -A "$UA" -L \
              -w 'final=%{url_effective} code=%{http_code} redirects=%{num_redirects}\n' \
              "https://kem-rp.com/$p" >> "$D/missing.txt" 2>&1
            curl -sSI --max-time 20 -A "$UA" "https://kem-rp.com/$p" \
              | grep -iE '^HTTP|^location|^server|^x-' >> "$D/missing.txt" 2>&1
          done

          echo "### E. Soft-404 check (does a missing page return 200?)" > "$D/soft404.txt"
          for p in nope-page-zzz errors/404 user/999999999 forum/nope; do
            printf '/%-22s ' "$p" >> "$D/soft404.txt"
            curl -sS -o /tmp/s -w 'code=%{http_code} size=%{size_download} ' --max-time 20 -A "$UA" \
              "https://kem-rp.com/$p" >> "$D/soft404.txt" 2>&1
            grep -oE '<title>[^<]*</title>' /tmp/s | head -1 >> "$D/soft404.txt" 2>&1
            echo >> "$D/soft404.txt"
          done

          echo "### F. Cache/compression on static assets" > "$D/static.txt"
          for u in https://kem-rp.com/assets__v.0.3.0/js/app.js https://kem-rp.com/assets__v.0.3.0/js/core/api.service.js; do
            echo "== $u" >> "$D/static.txt"
            curl -sS -o /dev/null -D - --max-time 20 -A "$UA" -H 'Accept-Encoding: gzip, br' "$u" \
              | grep -iE '^HTTP|cache-control|etag|content-encoding|content-length|vary' >> "$D/static.txt" 2>&1
          done

          echo "### G. Admin panel surface (footer/headers only, no auth attempts)" > "$D/admin.txt"
          for u in https://adm.kem-rp.com/ https://status.kem-rp.com/; do
            echo "== GET $u" >> "$D/admin.txt"
            curl -sS -o /tmp/adm -D - --max-time 20 -A "$UA" "$u" 2>&1 \
              | head -20 >> "$D/admin.txt"
            echo "-- title: $(grep -oE '<title>[^<]*</title>' /tmp/adm | head -1)" >> "$D/admin.txt"
            echo >> "$D/admin.txt"
          done

          echo "=== DONE ==="; ls -la "$D"

      - name: commit back
        run: |
          git config user.name relay-bot
          git config user.email relay@users.noreply.github.com
          git add relay-out/kem2
          git commit -m "audit: passive kem-rp.com api/cors report" || echo "no changes"
          git push
