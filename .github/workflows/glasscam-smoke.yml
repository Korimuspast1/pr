name: GlassCam emulator smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
      - "main"
    paths:
      - ".github/workflows/glasscam-smoke.yml"
      - ".github/scripts/glasscam-smoke.sh"
      - "glasscam/app/src/main/**"
      - "glasscam/app/build.gradle"

permissions:
  contents: write

jobs:
  smoke:
    name: API ${{ matrix.api-level }} glasscam smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [35]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: glasscam
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/glasscam-smoke-api${{ matrix.api-level }}.txt"
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/glasscam-debug.apk"
          echo "SMOKE_APK=$RUNNER_TEMP/glasscam-debug.apk" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene -camera-front emulated
          disable-animations: true
          disable-spellchecker: true
          script: set -o pipefail; bash .github/scripts/glasscam-smoke.sh ${{ matrix.api-level }} | tee -a "$GITHUB_WORKSPACE/glasscam-smoke-api${{ matrix.api-level }}.txt"

      - name: Commit smoke log and screenshots
        if: always()
        continue-on-error: true
        run: |
          mkdir -p build-transfer
          SRC="glasscam-smoke-api${{ matrix.api-level }}.txt"
          DST="build-transfer/glasscam-smoke-api${{ matrix.api-level }}-log.txt"
          if [ -f "$SRC" ]; then
            tail -n 1500 "$SRC" > "$DST"
          else
            echo "No smoke log was produced." > "$DST"
          fi
          # Скриншоты из base64-маркеров лога → glasscam/screenshots/*.png
          mkdir -p glasscam/screenshots
          python3 - "$DST" <<'PY'
          import base64, re, sys, os
          log = open(sys.argv[1], errors="ignore").read()
          for name in re.findall(r'SHOTB64_BEGIN:([\w-]+)', log):
              m = re.search(rf'SHOTB64_BEGIN:{name}\n([A-Za-z0-9+/=\s]+?)\n?SHOTB64_END:{name}', log)
              if not m:
                  continue
              try:
                  data = base64.b64decode(re.sub(r'\s', '', m.group(1)))
              except Exception:
                  continue
              if data[:8] == b'\x89PNG\r\n\x1a\n':
                  out = f'glasscam/screenshots/{name}.png'
                  open(out, 'wb').write(data)
                  print('saved', out, len(data))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$DST"
          git add -f glasscam/screenshots/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Smoke log unchanged"
            exit 0
          fi
          git commit -m "CI: glasscam smoke API ${{ matrix.api-level }} log + screenshots [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" && break || sleep 3
          done
