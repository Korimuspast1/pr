name: ayuox4gg probe
on:
  push:
    branches: ["arena/**"]
    paths: ["ayuox4gg/PROBE.txt"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "runner ok"; java -version; echo "ANDROID_HOME=$ANDROID_HOME"; df -h / | tail -1
