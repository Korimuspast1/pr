name: kem passive audit

# Пассивный аудит kem-rp.com: только то, что сайт отдаёт любому посетителю.
# Без перебора путей, без инъекций, без нагрузки. ~20 запросов, все GET.
on:
  push:
    paths:
      - '.github/workflows/kem-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: ssl toolchain
        run: which openssl curl dig && openssl version

      - name: passive collection
        run: |
          set -u
          D=relay-out/kem
          mkdir -p "$D"
          UA='Mozilla/5.0 (compatible; KemAudit/1.0; owner-authorized passive review)'

          echo "### 1. HTTP -> HTTPS redirect chain" > "$D/redirects.txt"
          curl -sS -o /dev/null -D - --max-time 20 -A "$UA" \
            -w '\nFINAL url=%{url_effective} code=%{http_code} redirects=%{num_redirects}\n' \
            http://kem-rp.com/ >> "$D/redirects.txt" 2>&1

          echo "### 2. Response headers (https root)" > "$D/headers.txt"
          curl -sS -o "$D/index.html" -D - --max-time 25 -A "$UA" \
            -w '\nTIMING dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} size=%{size_download}\n' \
            https://kem-rp.com/ >> "$D/headers.txt" 2>&1

          echo "### 3. TLS certificate + protocols" > "$D/tls.txt"
          echo | timeout 25 openssl s_client -connect kem-rp.com:443 -servername kem-rp.com 2>&1 \
            | openssl x509 -noout -subject -issuer -dates -ext subjectAltName >> "$D/tls.txt" 2>&1
          echo "--- negotiated ---" >> "$D/tls.txt"
          echo | timeout 25 openssl s_client -connect kem-rp.com:443 -servername kem-rp.com 2>&1 \
            | grep -E "Protocol|Cipher|Verify return code" >> "$D/tls.txt"
          echo "--- per-protocol support ---" >> "$D/tls.txt"
          for p in tls1_0 tls1_1 tls1_2 tls1_3; do
            if echo | timeout 15 openssl s_client -connect kem-rp.com:443 -servername kem-rp.com -"$p" 2>/dev/null | grep -q "Cipher is TLS"; then
              echo "$p SUPPORTED" >> "$D/tls.txt"
            else
              echo "$p no" >> "$D/tls.txt"
            fi
          done

          echo "### 4. Well-known / policy files" > "$D/wellknown.txt"
          for p in robots.txt sitemap.xml .well-known/security.txt security.txt \
                   .well-known/change-password humans.txt ads.txt; do
            code=$(curl -sS -o /tmp/w -w '%{http_code}' --max-time 15 -A "$UA" "https://kem-rp.com/$p" || echo ERR)
            size=$(wc -c </tmp/w 2>/dev/null || echo 0)
            ctype=$(curl -sSI --max-time 15 -A "$UA" "https://kem-rp.com/$p" 2>/dev/null | grep -i '^content-type' | tr -d '\r')
            printf '/%-32s %s size=%s %s\n' "$p" "$code" "$size" "$ctype" >> "$D/wellknown.txt"
          done

          echo "### 5. Auto-exposed sensitive files (single GET each, no exploitation)" > "$D/exposed.txt"
          for p in .git/HEAD .env .env.local config.json config.php composer.json \
                   package.json backup.zip db.sql dump.sql .DS_Store server-status; do
            code=$(curl -sS -o /tmp/e -w '%{http_code}' --max-time 15 -A "$UA" "https://kem-rp.com/$p" || echo ERR)
            size=$(wc -c </tmp/e 2>/dev/null || echo 0)
            head1=$(head -c 60 /tmp/e 2>/dev/null | tr -d '\r\n' | tr -c '[:print:]' '.')
            printf '/%-18s code=%s size=%s first=%s\n' "$p" "$code" "$size" "$head1" >> "$D/exposed.txt"
          done

          echo "### 6. CORS + methods" > "$D/cors.txt"
          curl -sSI --max-time 15 -A "$UA" -H 'Origin: https://evil.example' https://kem-rp.com/ \
            | grep -iE 'access-control|vary' >> "$D/cors.txt" 2>&1 || echo "(no CORS headers on /)" >> "$D/cors.txt"
          curl -sS -o /dev/null -D - -X OPTIONS --max-time 15 -A "$UA" https://kem-rp.com/ \
            | grep -i '^allow' >> "$D/cors.txt" 2>&1 || echo "(no Allow on OPTIONS)" >> "$D/cors.txt"

          echo "### 7. Hosts referenced by the site itself" > "$D/hosts.txt"
          grep -oE 'https?://[a-zA-Z0-9._-]+' "$D/index.html" | sed 's|https\?://||' \
            | sort -u | head -40 >> "$D/hosts.txt"
          echo "--- DNS for referenced hosts ---" >> "$D/hosts.txt"
          for h in kem-rp.com www.kem-rp.com global.kem-rp.com cdn.kem-rp.com api.kem-rp.com; do
            printf '%-24s ' "$h" >> "$D/hosts.txt"
            (getent hosts "$h" | head -2 | tr '\n' ' ') >> "$D/hosts.txt" 2>&1
            echo >> "$D/hosts.txt"
          done

          echo "### 8. HTML fingerprinting" > "$D/fingerprint.txt"
          grep -oiE '<meta[^>]*(generator|description|csrf|token)[^>]*>' "$D/index.html" | head -10 >> "$D/fingerprint.txt"
          echo "--- script srcs ---" >> "$D/fingerprint.txt"
          grep -oE '<script[^>]+src="[^"]+"' "$D/index.html" | sed 's/.*src="//;s/"$//' | head -25 >> "$D/fingerprint.txt"
          echo "--- forms ---" >> "$D/fingerprint.txt"
          grep -oE '<form[^>]*>' "$D/index.html" | head -10 >> "$D/fingerprint.txt"
          echo "--- framework hints ---" >> "$D/fingerprint.txt"
          grep -oiE '(next|nuxt|__NEXT_DATA__|vite|webpack|react|vue|svelte|laravel|csrf-token|_token|x-requested-with)' \
            "$D/index.html" | sort | uniq -c | sort -rn | head -10 >> "$D/fingerprint.txt"
          echo "--- cookies set (names/flags) ---" >> "$D/fingerprint.txt"
          grep -i '^set-cookie' "$D/headers.txt" | sed 's/=.*;/=<redacted>;/' >> "$D/fingerprint.txt" || echo none >> "$D/fingerprint.txt"

          echo "### 9. Sub-resource response headers (static + api)" > "$D/subres.txt"
          for u in https://global.kem-rp.com/brand.png https://kem-rp.com/robots.txt; do
            echo "== $u" >> "$D/subres.txt"
            curl -sSI --max-time 15 -A "$UA" "$u" 2>&1 | head -15 >> "$D/subres.txt"
          done

          echo "=== DONE ==="; ls -la "$D"

      - name: commit back
        run: |
          git config user.name relay-bot
          git config user.email relay@users.noreply.github.com
          git add relay-out/kem
          git commit -m "audit: passive kem-rp.com report" || echo "no changes"
          git push
