name: egress relay

# Temporary diagnostic relay (see SKILL.md / egress-diagnosis-bypass).
# GitHub runners have unrestricted egress, so they can reach hosts that the
# sandbox gateway blocks by TLS-SNI allowlist. Push-triggered because
# integration tokens cannot call workflow_dispatch.
on:
  push:
    paths:
      - '.github/workflows/egress-relay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: probe target hosts
        run: |
          set -u
          mkdir -p relay-out
          probe() {  # name url
            name="$1"; url="$2"
            # dummy credentials on purpose: a 401/400 JSON body proves arrival
            code=$(curl -sS --max-time 30 -o "relay-out/$name.body" \
                   -w '%{http_code}' "$url" || echo 'curl-failed')
            echo "$name $code" >> relay-out/status.txt
            printf '%s -> HTTP %s\n' "$name" "$code"
          }
          probe telegram_getme 'https://api.telegram.org/bot123456:dummy-TokenForEgressProbe/getMe'
          probe telegram_root  'https://api.telegram.org/'
          probe telegram_host  'https://149.154.166.110/'   # by IP, Host from URL is the IP
          echo '--- status.txt ---'; cat relay-out/status.txt
          echo '--- bodies ---'; for f in relay-out/*.body; do echo "== $f"; head -c 400 "$f"; echo; done

      - name: commit result back
        run: |
          git config user.name relay-bot
          git config user.email relay@users.noreply.github.com
          git add relay-out
          git commit -m "relay: egress probe result" || echo "nothing to commit"
          git push
