name: LimeWire sound swap

# Downloads two mod archives from LimeWire share links, moves every sound
# from the donor mod into the target mod, and commits the result back to
# this branch under delivery/.
#
# Runs on a GitHub runner because it has unrestricted internet access and can
# run a real browser - LimeWire encrypts files end-to-end and the decryption
# key lives in the "#..." fragment of the share link, so a plain GET is not
# enough.
#
# Diagnostics are committed to diagnostics/ on every run, success or not,
# because the agent driving this cannot reach the Actions log storage.

on:
  workflow_dispatch:
    inputs:
      donor_url:
        description: "LimeWire link of mod #1 (sounds are taken FROM here)"
        required: true
        type: string
      target_url:
        description: "LimeWire link of mod #2 (sounds are replaced IN here)"
        required: true
        type: string
      strategy:
        description: "Pairing strategy"
        required: false
        default: "basename"
        type: choice
        options: [basename, tail, mirror]
      extra_args:
        description: "Extra flags for swap_mod_sounds.py"
        required: false
        default: "--inject-unmatched --recurse-zips"
        type: string
  push:
    paths:
      - "mods/job.json"
      - "tools/limewire_download.py"
      - "tools/swap_mod_sounds.py"
      - ".github/workflows/limewire-sound-swap.yml"

permissions:
  contents: write

concurrency:
  group: sound-swap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  swap:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Resolve parameters
        id: p
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DONOR='${{ inputs.donor_url }}'
            TARGET='${{ inputs.target_url }}'
            STRAT='${{ inputs.strategy }}'
            EXTRA='${{ inputs.extra_args }}'
          else
            test -f mods/job.json || { echo "::error::mods/job.json is missing"; exit 1; }
            DONOR=$(jq -r '.donor_url'  mods/job.json)
            TARGET=$(jq -r '.target_url' mods/job.json)
            STRAT=$(jq -r '.strategy // "basename"' mods/job.json)
            EXTRA=$(jq -r '.extra_args // "--inject-unmatched --recurse-zips"' mods/job.json)
          fi
          { echo "donor=$DONOR"; echo "target=$TARGET";
            echo "strategy=$STRAT"; echo "extra=$EXTRA"; } >> "$GITHUB_OUTPUT"
          echo "donor  = $DONOR"
          echo "target = $TARGET"
          echo "strategy = $STRAT   extra = $EXTRA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Download mod 1 (donor)
        continue-on-error: true
        run: |
          mkdir -p mods out
          set -o pipefail
          python tools/limewire_download.py "${{ steps.p.outputs.donor }}" \
            -o mods/mod1_donor.bin --timeout 900 2>&1 | tee out/download_donor.log

      - name: Download mod 2 (target)
        continue-on-error: true
        run: |
          set -o pipefail
          python tools/limewire_download.py "${{ steps.p.outputs.target }}" \
            -o mods/mod2_target.bin --timeout 900 2>&1 | tee out/download_target.log

      - name: Identify downloads
        continue-on-error: true
        run: |
          mkdir -p out
          ls -la mods/ > out/mods_listing.txt 2>&1 || true
          cat out/mods_listing.txt
          python - <<'PY' 2>&1 | tee out/identify.txt
          import os, zipfile, shutil
          for tag, src in (("donor", "mods/mod1_donor.bin"), ("target", "mods/mod2_target.bin")):
              if not os.path.isfile(src):
                  print(f"{tag}: MISSING")
                  continue
              size = os.path.getsize(src)
              with open(src, "rb") as fh:
                  head = fh.read(512)
              isz = zipfile.is_zipfile(src)
              print(f"{tag}: {size} bytes  zip={isz}")
              print(f"{tag}: first bytes = {head[:64]!r}")
              if not isz:
                  try:
                      print(f"{tag}: as text = {head.decode('utf-8','replace')[:400]!r}")
                  except Exception:
                      pass
              else:
                  dst = f"mods/{tag}.zip"
                  shutil.move(src, dst)
                  with zipfile.ZipFile(dst) as z:
                      names = z.namelist()
                  print(f"{tag}: {len(names)} entries; first 30:")
                  for n in names[:30]:
                      print("   ", n)
          PY

      - name: Publish diagnostics to the branch
        if: always()
        run: |
          set -x
          mkdir -p diagnostics
          rm -rf diagnostics/*
          cp mods/*.png            diagnostics/ 2>/dev/null || true
          cp mods/*.jpg            diagnostics/ 2>/dev/null || true
          cp mods/*.html           diagnostics/ 2>/dev/null || true
          cp mods/*.ui.txt         diagnostics/ 2>/dev/null || true
          cp mods/*.network.log    diagnostics/ 2>/dev/null || true
          cp out/*.log out/*.txt   diagnostics/ 2>/dev/null || true
          # keep the branch light
          find diagnostics -type f -size +3M -print -delete || true
          ls -la diagnostics/ || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diagnostics/ || true
          if git diff --cached --quiet; then
            echo "no diagnostics to commit"
          else
            git commit -m "CI diagnostics for run ${{ github.run_id }} [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              echo "push retry $i"; sleep 5
            done
          fi

      - name: Fail early if a download did not produce a zip
        run: |
          ok=1
          test -f mods/donor.zip  || { echo "::error::mod 1 (donor) was not downloaded as a zip"; ok=0; }
          test -f mods/target.zip || { echo "::error::mod 2 (target) was not downloaded as a zip"; ok=0; }
          [ "$ok" = 1 ]

      - name: Inspect both archives
        run: |
          python - <<'PY' | tee out/inventory.txt
          import zipfile, posixpath
          from collections import Counter
          for tag in ("donor", "target"):
              p = f"mods/{tag}.zip"
              with zipfile.ZipFile(p) as z:
                  infos = [i for i in z.infolist() if not i.is_dir()]
              print(f"===== {tag}: {p} =====")
              print(f"entries: {len(infos)}")
              for e, n in Counter(posixpath.splitext(i.filename)[1].lower()
                                  for i in infos).most_common():
                  print(f"   {e or '(none)':14s} x{n}")
              print("-- full listing --")
              for i in sorted(infos, key=lambda i: i.filename.lower()):
                  print(f"   {i.file_size:10d}  {i.filename}")
              print()
          PY

      - name: Analyse both mods (generic report)
        continue-on-error: true
        run: |
          python tools/swap_mod_sounds.py mods/donor.zip mods/target.zip \
            --strategy "${{ steps.p.outputs.strategy }}" --recurse-zips \
            --dry-run --report out/plan.json | tee out/dryrun.txt

      - name: Transplant the engine sound (BeamNG-aware)
        id: build
        run: |
          DN=$(cat mods/mod1_donor.bin.name 2>/dev/null || echo "mod1.zip")
          TN=$(cat mods/mod2_target.bin.name 2>/dev/null || echo "mod2.zip")
          DS="${DN%.zip}"; TS="${TN%.zip}"
          OUT="out/${TS}_with_${DS}_sounds.zip"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "building $OUT"
          if python tools/beamng_engine_swap.py mods/donor.zip mods/target.zip \
               -o "$OUT" --with-exhaust --report out/report.json | tee out/result.txt; then
            echo "mode=beamng" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::BeamNG-aware swap failed, falling back to the generic file swap"
            python tools/swap_mod_sounds.py mods/donor.zip mods/target.zip \
              -o "$OUT" --strategy "${{ steps.p.outputs.strategy }}" \
              ${{ steps.p.outputs.extra }} --report out/report.json | tee out/result.txt
            echo "mode=generic" >> "$GITHUB_OUTPUT"
          fi
          ls -la out/

      - name: Verify the built mod
        run: |
          python - "${{ steps.build.outputs.out }}" <<'PY' | tee out/verify.txt
          import sys, zipfile, posixpath
          sys.path.insert(0, "tools")
          import beamng_engine_swap as B
          z = zipfile.ZipFile(sys.argv[1]); names = set(z.namelist())
          bad = z.testzip()
          print("archive integrity:", bad or "OK")
          assert not bad
          nblend = 0; missing_total = 0
          for n in sorted(names):
              if n.lower().endswith(".sfxblend2d.json"):
                  nblend += 1
                  b = B.parse_jsonc(z.read(n).decode("utf-8", "replace"))
                  paths = B.sample_paths(b)
                  missing = [p for p in paths if p not in names]
                  missing_total += len(missing)
                  print(f"blend {n}: {len(paths)} samples, {len(missing)} missing")
                  for m in missing[:5]:
                      print("   MISSING:", m)
          nj = 0
          for n in sorted(names):
              if n.lower().endswith(".jbeam"):
                  B.parse_jsonc(z.read(n).decode("utf-8", "replace")); nj += 1
          print(f"jbeam files parsed OK: {nj}")
          print(f"blends checked: {nblend}, dangling sample refs: {missing_total}")
          assert missing_total == 0, "a blend points at a sample that is not in the zip"
          print("VERIFY OK")
          PY

      - name: Upload everything as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sound-swap-output
          path: |
            out/
            mods/*.png
            mods/*.jpg
            mods/*.html
            mods/*.txt
            mods/*.log
          retention-days: 7
          if-no-files-found: warn

      - name: Commit the finished mod back to the branch
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf delivery
          mkdir -p delivery
          cp "${{ steps.build.outputs.out }}" delivery/
          for f in report.json result.txt dryrun.txt inventory.txt verify.txt; do
            cp "out/$f" delivery/ 2>/dev/null || true
          done
          ls -la delivery/
          git add -A delivery/
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Deliver mod 2 with mod 1 engine sound (${{ steps.build.outputs.mode }}) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" \
              && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push retry $i"; sleep 5
          done
          exit 1
