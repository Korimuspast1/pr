name: LimeWire sound swap

# Downloads two mod archives from LimeWire share links, moves every sound
# from the donor mod into the target mod, and commits the result back to
# this branch under delivery/.
#
# Runs on a GitHub runner because it has unrestricted internet access and can
# run a real browser - LimeWire encrypts files end-to-end and the decryption
# key lives in the "#..." fragment of the share link, so a plain GET is not
# enough.
#
# Triggered by editing mods/job.json (push) or manually (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      donor_url:
        description: "LimeWire link of mod #1 (sounds are taken FROM here)"
        required: true
        type: string
      target_url:
        description: "LimeWire link of mod #2 (sounds are replaced IN here)"
        required: true
        type: string
      strategy:
        description: "Pairing strategy"
        required: false
        default: "basename"
        type: choice
        options: [basename, tail, mirror]
      extra_args:
        description: "Extra flags for swap_mod_sounds.py"
        required: false
        default: "--inject-unmatched --recurse-zips"
        type: string
  push:
    paths:
      - "mods/job.json"
      - "tools/limewire_download.py"
      - "tools/swap_mod_sounds.py"
      - ".github/workflows/limewire-sound-swap.yml"

permissions:
  contents: write

concurrency:
  group: sound-swap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  swap:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Resolve parameters
        id: p
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DONOR='${{ inputs.donor_url }}'
            TARGET='${{ inputs.target_url }}'
            STRAT='${{ inputs.strategy }}'
            EXTRA='${{ inputs.extra_args }}'
          else
            test -f mods/job.json || { echo "::error::mods/job.json is missing"; exit 1; }
            DONOR=$(jq -r '.donor_url'  mods/job.json)
            TARGET=$(jq -r '.target_url' mods/job.json)
            STRAT=$(jq -r '.strategy // "basename"' mods/job.json)
            EXTRA=$(jq -r '.extra_args // "--inject-unmatched --recurse-zips"' mods/job.json)
          fi
          echo "donor=$DONOR"   >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "strategy=$STRAT" >> "$GITHUB_OUTPUT"
          echo "extra=$EXTRA"   >> "$GITHUB_OUTPUT"
          echo "donor  = $DONOR"
          echo "target = $TARGET"
          echo "strategy = $STRAT   extra = $EXTRA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Download mod 1 (donor)
        continue-on-error: true
        run: |
          mkdir -p mods out
          python tools/limewire_download.py "${{ steps.p.outputs.donor }}" \
            -o mods/mod1_donor.bin --timeout 900

      - name: Download mod 2 (target)
        continue-on-error: true
        run: |
          python tools/limewire_download.py "${{ steps.p.outputs.target }}" \
            -o mods/mod2_target.bin --timeout 900

      - name: Identify downloads
        run: |
          ls -la mods/ || true
          python - <<'PY'
          import os, zipfile, shutil
          for tag, src in (("donor", "mods/mod1_donor.bin"), ("target", "mods/mod2_target.bin")):
              if not os.path.isfile(src):
                  print(f"{tag}: MISSING")
                  continue
              size = os.path.getsize(src)
              with open(src, "rb") as fh:
                  magic = fh.read(8)
              isz = zipfile.is_zipfile(src)
              print(f"{tag}: {size} bytes  zip={isz}  magic={magic!r}")
              if isz:
                  dst = f"mods/{tag}.zip"
                  shutil.move(src, dst)
                  with zipfile.ZipFile(dst) as z:
                      names = z.namelist()
                  print(f"{tag}: {len(names)} entries; first 25:")
                  for n in names[:25]:
                      print("   ", n)
          PY

      - name: Fail early if a download did not produce a zip
        run: |
          ok=1
          test -f mods/donor.zip  || { echo "::error::mod 1 (donor) was not downloaded as a zip"; ok=0; }
          test -f mods/target.zip || { echo "::error::mod 2 (target) was not downloaded as a zip"; ok=0; }
          [ "$ok" = 1 ]

      - name: Inspect both archives
        run: |
          python - <<'PY' | tee out/inventory.txt
          import zipfile, posixpath
          from collections import Counter
          for tag in ("donor", "target"):
              p = f"mods/{tag}.zip"
              with zipfile.ZipFile(p) as z:
                  infos = [i for i in z.infolist() if not i.is_dir()]
              print(f"===== {tag}: {p} =====")
              print(f"entries: {len(infos)}")
              for e, n in Counter(posixpath.splitext(i.filename)[1].lower() for i in infos).most_common():
                  print(f"   {e or '(none)':14s} x{n}")
              print("-- full listing --")
              for i in sorted(infos, key=lambda i: i.filename.lower()):
                  print(f"   {i.file_size:10d}  {i.filename}")
              print()
          PY

      - name: Dry-run the swap
        run: |
          python tools/swap_mod_sounds.py mods/donor.zip mods/target.zip \
            --strategy "${{ steps.p.outputs.strategy }}" ${{ steps.p.outputs.extra }} \
            --dry-run --report out/plan.json | tee out/dryrun.txt

      - name: Build the patched mod
        run: |
          NAME=$(python -c "import sys,os;print(os.path.basename('mods/target.zip'))")
          python tools/swap_mod_sounds.py mods/donor.zip mods/target.zip \
            -o "out/mod2_with_mod1_sounds.zip" \
            --strategy "${{ steps.p.outputs.strategy }}" ${{ steps.p.outputs.extra }} \
            --report out/report.json | tee out/result.txt
          ls -la out/

      - name: Upload everything as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sound-swap-output
          path: |
            out/
            mods/*.png
            mods/*.html
            mods/*.log
          retention-days: 7
          if-no-files-found: warn

      - name: Commit the result back to the branch
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p delivery
          cp out/mod2_with_mod1_sounds.zip delivery/
          for f in report.json result.txt dryrun.txt inventory.txt; do
            cp "out/$f" delivery/ 2>/dev/null || true
          done
          git add -f delivery/
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Deliver mod 2 with mod 1 sounds (built by CI) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" \
              && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            echo "push retry $i"; sleep 5
          done
          exit 1
