name: fetch-source-video

on:
  push:
    branches: [arena/7de30c9c-pr]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-source-video
  cancel-in-progress: false

jobs:
  fetch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dl-video]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip >/dev/null
          python -m pip install -q --upgrade yt-dlp pysocks
          yt-dlp --version

      - name: Start tunnels
        continue-on-error: true
        run: |
          set +e
          mkdir -p edits/source
          WLOG=edits/source/warp.log
          : > "$WLOG"

          check() {  # $1 = socks url, $2 = label
            CODE=$(curl -s --max-time 20 --socks5-hostname "${1#socks5h://}" -o /dev/null -w "%{http_code}" https://www.youtube.com/ 2>/dev/null)
            IP=$(curl -s --max-time 20 --socks5-hostname "${1#socks5h://}" https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null | grep -E '^(ip|loc)=' | tr '\n' ' ')
            echo "$2 youtube=$CODE $IP" | tee -a "$WLOG"
            [ "$CODE" = "200" ]
          }

          # ---------- 1) official cloudflare warp, proxy mode ----------
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg -o /tmp/cf.gpg 2>/dev/null
          sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg /tmp/cf.gpg 2>/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq 2>&1 | tail -3 | tee -a "$WLOG"
          sudo apt-get install -y -qq cloudflare-warp 2>&1 | tail -3 | tee -a "$WLOG"
          warp-cli --accept-tos registration new 2>&1 | tee -a "$WLOG"
          warp-cli --accept-tos mode proxy 2>&1 | tee -a "$WLOG"
          warp-cli --accept-tos proxy port 40000 2>&1 | tee -a "$WLOG"
          warp-cli --accept-tos connect 2>&1 | tee -a "$WLOG"
          for i in $(seq 1 10); do sleep 4; warp-cli --accept-tos status 2>&1 | tail -1 | tee -a "$WLOG"; done
          check socks5h://127.0.0.1:40000 "warp-cli" && echo "USE_PROXY=socks5h://127.0.0.1:40000" > /tmp/proxy.env

          # ---------- 2) warp-plus with pinned endpoint ----------
          if [ ! -s /tmp/proxy.env ]; then
            curl -fsSL --retry 3 -o /tmp/wp.zip https://github.com/bepass-org/warp-plus/releases/download/v1.2.6/warp-plus_linux-amd64.zip
            unzip -o -q /tmp/wp.zip -d /tmp/wp && chmod +x /tmp/wp/warp-plus
            for ARGS in "-4 -e 162.159.192.1:2408" "-4 --scan" "-4 --cfon --country PL --gool"; do
              pkill -f warp-plus; sleep 2
              echo "=== warp-plus $ARGS" | tee -a "$WLOG"
              nohup /tmp/wp/warp-plus -b 127.0.0.1:8086 $ARGS > /tmp/wp.out 2>&1 &
              for i in $(seq 1 8); do
                sleep 5
                if check socks5h://127.0.0.1:8086 "warp-plus[$ARGS]"; then
                  echo "USE_PROXY=socks5h://127.0.0.1:8086" > /tmp/proxy.env
                  break 2
                fi
              done
              tail -5 /tmp/wp.out | tee -a "$WLOG"
            done
          fi
          cat /tmp/proxy.env 2>/dev/null | tee -a "$WLOG"

      - name: Download source video
        continue-on-error: true
        env:
          URL: https://www.youtube.com/watch?v=40-Bp04QC6w
        run: |
          mkdir -p edits/source
          LOG=edits/source/fetch.log
          : > "$LOG"; exec > >(tee -a "$LOG") 2>&1
          set +e

          try_proxy() {
            echo ""
            echo "===== yt-dlp via $1"
            rm -f edits/source/raw.mp4*
            yt-dlp -v --no-warnings --no-playlist --retries 3 --fragment-retries 10 \
              --proxy "$1" --socket-timeout 30 \
              -f "bv*[height<=1080]+ba/b[height<=1080]" \
              --merge-output-format mp4 -o "edits/source/raw.mp4" "$URL"
          }

          if [ -s /tmp/proxy.env ]; then
            . /tmp/proxy.env
            echo "using proxy: $USE_PROXY"
            try_proxy "$USE_PROXY"
          fi

          if [ ! -s edits/source/raw.mp4 ]; then
            echo "===== direct (no proxy)"
            rm -f edits/source/raw.mp4*
            yt-dlp -v --no-warnings --no-playlist --retries 2 \
              -f "bv*[height<=720]+ba/b[height<=720]" \
              --merge-output-format mp4 -o "edits/source/raw.mp4" "$URL"
          fi

          if [ ! -s edits/source/raw.mp4 ]; then
            echo "===== public frontends"
            python3 scripts/fetch_source.py || true
          fi

          if [ -s edits/source/raw.mp4 ]; then
            echo "--- DOWNLOAD OK"; ls -lh edits/source/raw.mp4
            ffprobe -v error -show_entries format=duration -of default=nw=1 edits/source/raw.mp4
          else
            echo "--- DOWNLOAD FAILED"
          fi
          exit 0

      - name: Transcode to a git-friendly size
        if: hashFiles('edits/source/raw.mp4') != ''
        run: |
          set -e
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 edits/source/raw.mp4
          for H in 720 600 480; do
            ffmpeg -y -v error -i edits/source/raw.mp4 -vf "scale=-2:$H" \
              -c:v libx264 -preset veryfast -crf 30 -pix_fmt yuv420p \
              -c:a aac -b:a 96k -movflags +faststart edits/source/mono-vajbkoding.mp4
            SZ=$(stat -c%s edits/source/mono-vajbkoding.mp4); echo "h=$H size=$SZ"
            [ "$SZ" -lt 88000000 ] && break
          done
          rm -f edits/source/raw.mp4

      - name: Push results back to the branch
        if: always()
        run: |
          set -e
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          ls -lh edits/source/ || true
          git add -f edits/source/ || true
          if git diff --cached --quiet; then echo "nothing to push"; exit 0; fi
          git commit -m "bot: source video / log [skip ci]"
          for i in 1 2 3; do git push origin HEAD:arena/7de30c9c-pr && break || sleep 5; done
