name: Publish Telegram Gifts APK Release

on:
  push:
    branches:
      - arena/5866a533-pr
      - main
    paths:
      - 'cocaser-telegram-gifts.apk'
      - '.github/workflows/publish-apk-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare checksum and release notes
        run: |
          sha256sum cocaser-telegram-gifts.apk > SHA256SUMS.txt
          cat << 'NOTES' > RELEASE_NOTES.md
          ### Telegram Gifts 2.0.0 (`cocaser.app`) — Android APK

          - **651 официальный подарок и скин Telegram** (все 124 коллекции, 11 обычных подарков чата, все лимитированные спецвыпуски и 492 скина моделей)
          - **40 кейсов**, Маркет, Крафт, Апгрейд, Ракета, Альбом и Профиль в нативном дизайне Telegram
          - **Лёгкая регистрация и вход (Логин + Пароль)** при запуске (без почты)
          - **Облачная синхронизация Firebase (`lool-4d49c`)** через `google-services.json`
          - **Код игры больше не лежит в APK в открытом виде**: в `assets/` только заглушка-загрузчик (6.6 КБ) и пакет `r0.pak`, зашифрованный **AES-256-GCM**; расшифровка идёт в памяти при запуске. Энтропия пакета 7.9998 бит/байт
          - **Убрана тема «Liquid glass»** — остались только понятные палитры, близкие к оригинальному оформлению
          - **Убраны экспорт и импорт сохранения** — работает только автосохранение
          - **Убрано поле даты рождения** из профиля
          - **Удалена выдача денег «+100к»** и **кнопка включения/выключения звука** в шапке
          - **Социальные функции** (кнопка 👥): публичные профили игроков, заявки в друзья, личные сообщения, передача подарков между игроками и **P2P-маркет** (выставить / купить / снять лот / забрать звёзды)
          - **GHASH исправлен и включён E2E в личных сообщениях**: ECDH P-256 + HKDF-SHA256 + AES-256-GCM (NIST-вектор и 200 случайных тестов против эталона — PASS; подделка шифртекста отклоняется с `GCM_AUTH_FAILED`). Открытый ключ публикуется в профиле, закрытый хранится только на устройстве
          - **Запрещён зум сайта** (pinch, двойной тап, Ctrl+колесо, `user-scalable=no`) и убраны видимые признаки WebView: нет зума/скроллбаров/overscroll-подсветки, кастомный User-Agent без `wv`, отключён WebView-деббаг
          - Для соцфункций вставь обновлённые правила Firestore из `FIREBASE_RULES.md` (коллекции `pub`, `freq`, `dm`, `transfers`, `p2p`)
          - **Исправлен пустой экран 2.2.0**: оставалась обёртка над удалённой функцией выдачи денег — падал весь скрипт. Проверено запуском в эмуляторе браузера: 0 ошибок, кейсы отрисовываются
          - **Убраны все надписи про синхронизацию** на экране входа и в профиле (остался только логин и кнопка «Выйти»)
          - **Серверная проверка без Cloud Functions**: строгие правила Firestore с машинами состояний для передач и P2P — вставь из `FIREBASE_RULES.md` по прямой ссылке на редактор правил
          - **Соцхаб починен под строгими правилами**: Firestore запрещает читать списки dm/freq/transfers одним запросом («правила — не фильтры»), клиент переведён на точечные runQuery по from/to. Экран ошибки теперь показывает настоящий код ошибки вместо общей фразы
          - **Кастомные SVG вместо смайликов** во всём соцхабе и кнопке соцсети в шапке (люди, друзья, чат, подарок, маркет, отправка, обновление)
          - **Убраны все технические подписи**: «E2E включено», пояснения в передачах/P2P/подарках, коды ошибок, упоминания Firebase в ошибках входа. В чате вместо них — нормальная шапка с аватаром и именем собеседника
          - Вкладки соцхаба больше не обрезаются справа — переносятся на вторую строку
          - **Публичные профили**: тап по игроку в «Людях» или «Друзьях» открывает его профиль — аватар, @username, описание, звёзды, число подарков и коллекции, витрина подарков, кнопки «В друзья» / «Написать» / «Подарить» (по статусу отношений)
          - **Фикс клавиатуры в чате**: поле ввода 16px (нет автозума при фокусе), чат сжимается под клавиатуру (`interactive-widget=resizes-content` + слежение за visualViewport), поле ввода липкое снизу и само подтягивается над клавиатурой
          - Подпись прежним постоянным ключом (SHA-256 `0F:96:E1:C6:…:13:4F:DB`), поэтому обновление поверх старых версий устанавливается без удаления данных
          - Пакет: `cocaser.app` · `versionCode 8` · `minSdk 24` / `targetSdk 34` · подпись APK Signature **v2 + v3**
          - Правила для Firebase Firestore лежат в файле `FIREBASE_RULES.md`
          NOTES

      - name: Create or update GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="telegram-gifts-v2.6.0"
          TITLE="Telegram Gifts 2.6.0 — Публичные профили игроков + фикс клавиатуры в чате (APK)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" cocaser-telegram-gifts.apk SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md --latest
          else
            gh release create "$TAG" cocaser-telegram-gifts.apk SHA256SUMS.txt \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
