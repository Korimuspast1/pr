name: Static triage of external sample

# ВНИМАНИЕ: образец только скачивается и разбирается статически.
# Он никогда не запускается, не публикуется артефактом и не попадает в репозиторий.
# В ветку коммитится только текстовый отчёт.

on:
  # только ручной запуск: иначе workflow качал бы образец при каждой правке
  workflow_dispatch:

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SAMPLE_URL: https://www.mediafire.com/file/mrmg62ns6g296z9/fakevpn.zip/file
      REPORT: ${{ github.workspace }}/reports/fakevpn-static-triage.txt
    steps:
      - uses: actions/checkout@v4

      - name: Инструменты
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full john >/dev/null
          python3 -m pip install --quiet --disable-pip-version-check pyzipper androguard asn1crypto

      - name: Скачать образец во временный каталог
        run: python3 .github/scripts/fetch_sample.py "$SAMPLE_URL" "$RUNNER_TEMP/fakevpn.zip"

      - name: Хеши и структура архива
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            echo "Цель: $SAMPLE_URL"
            echo "Дата разбора (UTC): $(date -u '+%Y-%m-%d %H:%M')"
            echo
            echo "################ 1. ХЕШИ ################"
            sha256sum "$RUNNER_TEMP/fakevpn.zip"
            md5sum "$RUNNER_TEMP/fakevpn.zip"
            ls -l "$RUNNER_TEMP/fakevpn.zip"
            echo
            echo "################ 2. СТРУКТУРА АРХИВА (7z) ################"
            7z l -slt "$RUNNER_TEMP/fakevpn.zip" 2>&1 | grep -Ei '^(Path|Size|Packed Size|Method|Encrypted|CRC) = ' | head -80
            echo
            echo "################ 3. АВТОМАТИЧЕСКИЙ ТРИАЖ ZIP ################"
            python3 tools/malware-triage/triage.py "$RUNNER_TEMP/fakevpn.zip" || true
            echo
            echo "################ 4. РАСПАКОВКА ################"
          } > "$REPORT"
          cat "$REPORT"

      - name: Распаковать (с подбором пароля при необходимости)
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/unpacked"
          if python3 .github/scripts/unlock_zip.py "$RUNNER_TEMP/fakevpn.zip" "$RUNNER_TEMP/unpacked" >> "$REPORT" 2>&1; then
            echo "распаковано без подбора" >> "$REPORT"
            exit 0
          fi
          {
            echo
            echo "Типовые пароли не подошли — подбираю по словарю rockyou (ZipCrypto)."
          } >> "$REPORT"

          curl -sSL --retry 2 -o "$RUNNER_TEMP/rockyou.txt" \
            https://github.com/brannondorsey/naive-hashcat/releases/download/data/rockyou.txt || true
          echo "словарь: $(wc -l < "$RUNNER_TEMP/rockyou.txt" 2>/dev/null || echo 0) строк" >> "$REPORT"

          gcc -O2 -fopenmp -o "$RUNNER_TEMP/zipcrack" tools/malware-triage/zipcrack.c >> "$REPORT" 2>&1 || {
            echo "не удалось собрать zipcrack" >> "$REPORT"; exit 0; }

          python3 tools/malware-triage/zipcrypto_hdr.py "$RUNNER_TEMP/fakevpn.zip" \
            "$RUNNER_TEMP/hdr.bin" >> "$REPORT" 2>&1 || exit 0

          "$RUNNER_TEMP/zipcrack" "$RUNNER_TEMP/rockyou.txt" "$RUNNER_TEMP/hdr.bin" \
            > "$RUNNER_TEMP/candidates.txt" 2>> "$REPORT" || true
          echo "кандидатов от zipcrack: $(wc -l < "$RUNNER_TEMP/candidates.txt" 2>/dev/null || echo 0)" >> "$REPORT"

          PW="$(python3 tools/malware-triage/verify_candidates.py "$RUNNER_TEMP/fakevpn.zip" \
                 "$RUNNER_TEMP/candidates.txt" 2>> "$REPORT" | head -1)"
          echo "найденный пароль: ${PW:-нет}" >> "$REPORT"
          if [ -n "$PW" ]; then
            python3 .github/scripts/unlock_zip.py "$RUNNER_TEMP/fakevpn.zip" "$RUNNER_TEMP/unpacked" \
              --password="$PW" >> "$REPORT" 2>&1 || true
          fi

      - name: Разбор APK
        run: |
          set -uo pipefail
          shopt -s nullglob
          found=0
          for f in "$RUNNER_TEMP"/unpacked/*.apk; do
            found=1
            {
              echo
              echo "################ 5. ТРИАЖ $(basename "$f") ################"
              python3 tools/malware-triage/triage.py "$f" || true
              echo
              python3 tools/malware-triage/apk_analyze.py "$f" || true
            } >> "$REPORT" 2>&1
          done
          if [ "$found" = 0 ]; then
            echo "" >> "$REPORT"
            echo "APK не извлечены — разбор содержимого не выполнен." >> "$REPORT"
          fi
          tail -120 "$REPORT"

      - name: Payload второй стадии
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/payload"
          {
            echo
            echo "################ 6. PAYLOAD ВТОРОЙ СТАДИИ ################"
            shopt -s nullglob
            for f in "$RUNNER_TEMP"/unpacked/*.apk; do
              python3 tools/malware-triage/extract_payload.py "$f" "$RUNNER_TEMP/payload" 111 || true
            done
            for f in "$RUNNER_TEMP"/payload/*.apk; do
              echo
              echo "--- разбор извлечённого payload: $(basename "$f") ---"
              python3 tools/malware-triage/apk_analyze.py "$f" | head -70 || true
            done
            echo
            echo "--- проверка зашифрованного asset дроппера ---"
            set +e
            if [ -f "$RUNNER_TEMP/unpacked/Button VPN.apk" ]; then
              python3 - "$RUNNER_TEMP/unpacked/Button VPN.apk" "$RUNNER_TEMP/api_patch.bin" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              data = z.read("assets/api_patch.bin")
          open(sys.argv[2], "wb").write(data)
          print(f"api_patch.bin: {len(data)} байт, начало {data[:16].hex()}")
          with open("/tmp/ap_hdr.bin", "wb") as fh:
              fh.write(data[:12] + b"\x00")
          with open("/tmp/ap_next.bin", "wb") as fh:
              fh.write(data[12:16])
          PY
              PW2="$(ZIPCRACK_NEXT=/tmp/ap_next.bin "$RUNNER_TEMP/zipcrack" "$RUNNER_TEMP/rockyou.txt" \
                       /tmp/ap_hdr.bin 4 504b0304 2>/dev/null | head -1 || true)"
              echo "пароль для api_patch.bin: ${PW2:-нет}"
              if [ -n "$PW2" ]; then
                python3 tools/malware-triage/zipcrypto_decrypt.py "$RUNNER_TEMP/api_patch.bin" \
                  "$RUNNER_TEMP/payload2.apk" "$PW2" || true
                sha256sum "$RUNNER_TEMP/payload2.apk" "$RUNNER_TEMP/unpacked/Button VPN(1).apk" 2>/dev/null || true
              fi
            fi
            echo
            echo "хэши всех APK (для сверки):"
            sha256sum "$RUNNER_TEMP"/unpacked/*.apk "$RUNNER_TEMP"/payload/*.apk 2>/dev/null || true
          } >> "$REPORT" 2>&1
          tail -50 "$REPORT"

      - name: Опубликовать отчёт в ветку
        if: always()
        run: |
          set -euo pipefail
          mkdir -p reports
          ls -l reports
          git config user.name "triage-bot"
          git config user.email "triage-bot@users.noreply.github.com"
          git add reports/fakevpn-static-triage.txt
          git commit -m "Static triage report for fakevpn.zip [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Удалить образец
        if: always()
        run: rm -rf "$RUNNER_TEMP"/fakevpn.zip "$RUNNER_TEMP"/unpacked "$RUNNER_TEMP"/rockyou.txt "$RUNNER_TEMP"/hash.txt "$RUNNER_TEMP"/pot.txt || true
