name: Nimbus Android

# Builds and tests the Android port. The sing-box core (libbox.aar) is not in the repository: it
# is downloaded from the pinned release before Gradle runs, so no Go toolchain and no NDK are
# needed here.
#
# The runners' Android SDK is the one baked into the GitHub image; only the platform the build
# asks for is installed on top, because a missing compileSdk is the failure that looks like a
# code error and isn't one.
#
# Failures are written back into the pull request as a comment and into the check run as
# annotations, so a compile error can be read from the GitHub API instead of from a log download.

on:
  push:
    branches: [main]
    paths:
      - 'nimbus-android/**'
      - '.github/workflows/nimbus-android.yml'
  pull_request:
    paths:
      - 'nimbus-android/**'
      - '.github/workflows/nimbus-android.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  JAVA_VERSION: '17'
  # What the build compiles against. Kept in one place: the SDK step below installs exactly this.
  COMPILE_SDK: '37'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nimbus-android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Android SDK
        run: |
          set -uo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          command -v sdkmanager || ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" || true
          # The image ships with the licences accepted; do it again in case a fresh SDK is used.
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-${COMPILE_SDK}" "platform-tools" || true
          sdkmanager --list_installed 2>/dev/null | head -30 || true

      - name: Fetch the sing-box core (libbox.aar)
        run: |
          set -euo pipefail
          . ./libbox.env.sh
          ls -l app/libs/

      - name: Unit tests
        run: |
          set -uo pipefail
          ./gradlew --no-daemon --stacktrace :app:testReleaseUnitTest 2>&1 | tee ../gradle.log
          exit "${PIPESTATUS[0]}"

      - name: Annotate Kotlin errors
        if: failure()
        run: |
          set -uo pipefail
          # "e: file:///path:line:col message" is what kotlinc prints; turn it into an annotation.
          grep -E '^e: ' ../gradle.log 2>/dev/null | head -80 |
            sed -E 's|^e: file://([^:]+):([0-9]+):([0-9]+) (.*)$|::error file=\1,line=\2,col=\3::\4|' || true
          grep -E '^(FAILURE|What went wrong|Caused by|Execution failed|A problem occurred)' ../gradle.log 2>/dev/null |
            head -20 | sed -E 's|^(.*)$|::error::\1|' || true

      - name: Report the failure in the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          body=$(mktemp)
          {
            echo "### Сборка упала: ${{ github.job }}"
            echo
            echo 'Ошибки компилятора:'
            echo '```'
            grep -E '^e: |error: ' ../gradle.log 2>/dev/null | head -60 || echo '(нет строк "e:" — см. хвост ниже)'
            echo '```'
            echo
            echo '<details><summary>Что сказал Gradle и последние 150 строк</summary>'
            echo
            echo '```'
            {
              grep -A 12 -E '^\* What went wrong|^\* Where' ../gradle.log 2>/dev/null | head -60
              echo '…'
              tail -150 ../gradle.log 2>/dev/null
            } || true
            echo '```'
            echo '</details>'
          } > "$body"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"

      - name: Collect generated configs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: generated-configs
          path: nimbus-android/app/build/generated-configs/
          if-no-files-found: ignore

      - name: Collect the build log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: ignore

  apk:
    name: APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # "universal" carries every ABI; the splits are what most phones should install.
        abi: [universal, arm64-v8a, armeabi-v7a, x86_64]
    defaults:
      run:
        working-directory: nimbus-android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Android SDK
        run: |
          set -uo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-${COMPILE_SDK}" "platform-tools" || true

      - name: Fetch the sing-box core (libbox.aar)
        run: |
          set -euo pipefail
          . ./libbox.env.sh

      - name: Assemble
        run: |
          set -uo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee ../gradle.log
          exit "${PIPESTATUS[0]}"

      - name: Annotate Kotlin errors
        if: failure()
        run: |
          set -uo pipefail
          grep -E '^e: ' ../gradle.log 2>/dev/null | head -80 |
            sed -E 's|^e: file://([^:]+):([0-9]+):([0-9]+) (.*)$|::error file=\1,line=\2,col=\3::\4|' || true

      - name: Report the failure in the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          body=$(mktemp)
          {
            echo "### Сборка APK упала: ${{ matrix.abi }}"
            echo '```'
            grep -E '^e: |error: |^\* What went wrong' ../gradle.log 2>/dev/null | head -60 || true
            echo '```'
            echo '<details><summary>хвост лога</summary>'
            echo
            echo '```'
            tail -120 ../gradle.log 2>/dev/null || true
            echo '```'
            echo '</details>'
          } > "$body"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"

      - name: Rename
        run: |
          set -euo pipefail
          version=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)
          found=$(ls app/build/outputs/apk/release/ | grep -- "-${{ matrix.abi }}-release.apk$" || true)
          if [ -z "$found" ]; then
            echo "no APK for ${{ matrix.abi }} in:"; ls -R app/build/outputs/apk/release/; exit 1
          fi
          mkdir -p dist
          # The name the in-app updater looks for: Nimbus-<version>-<abi>.apk (engine/Update.kt).
          cp "app/build/outputs/apk/release/$found" "dist/Nimbus-${version}-${{ matrix.abi }}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: Nimbus-android-${{ matrix.abi }}
          path: nimbus-android/dist/*.apk

  checksums:
    name: Checksums
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: Nimbus-android-*
          path: dist
          merge-multiple: true

      # The in-app updater (engine/Update.kt) reads the newest release of the repository: it looks
      # for Nimbus-<version>-<abi>.apk next to SHA256SUMS.txt and refuses a file whose sum differs.
      # Publishing a release is a maintainer's step (tag v<VERSION_NAME>, attach dist/*), so the
      # sums are built here and uploaded as an artifact.
      - name: SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v5
        with:
          name: Nimbus-apks
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
