name: Nimbus Android

# Builds the installable APKs of the Android port. The sing-box core (libbox.aar) is not in the
# repository: it is downloaded from the pinned release before Gradle runs, so the build needs no
# Go toolchain and no NDK of its own.

on:
  push:
    branches: [main]
    paths:
      - 'nimbus-android/**'
      - '.github/workflows/nimbus-android.yml'
  pull_request:
    paths:
      - 'nimbus-android/**'
      - '.github/workflows/nimbus-android.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nimbus-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Fetch the sing-box core (libbox.aar)
        run: |
          set -euo pipefail
          . ./libbox.env.sh

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testReleaseUnitTest

      - name: Collect generated configs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-configs
          path: nimbus-android/app/build/generated-configs/
          if-no-files-found: ignore

  apk:
    name: APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # "universal" carries every ABI; the splits are what most phones should install.
        abi: [universal, arm64-v8a, armeabi-v7a, x86_64]
    defaults:
      run:
        working-directory: nimbus-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Fetch the sing-box core (libbox.aar)
        run: |
          set -euo pipefail
          . ./libbox.env.sh

      - name: Assemble
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rename
        run: |
          set -euo pipefail
          version=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)
          found=$(ls app/build/outputs/apk/release/ | grep -- "-${{ matrix.abi }}-release.apk$" || true)
          if [ -z "$found" ]; then
            echo "no APK for ${{ matrix.abi }} in:"; ls -R app/build/outputs/apk/release/; exit 1
          fi
          mkdir -p dist
          # The name the in-app updater looks for: Nimbus-<version>-<abi>.apk (engine/Update.kt).
          cp "app/build/outputs/apk/release/$found" "dist/Nimbus-${version}-${{ matrix.abi }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Nimbus-android-${{ matrix.abi }}
          path: nimbus-android/dist/*.apk

  checksums:
    name: Checksums
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Nimbus-android-*
          path: dist
          merge-multiple: true

      # The in-app updater (engine/Update.kt) reads the newest release of the repository: it looks
      # for Nimbus-<version>-<abi>.apk next to SHA256SUMS.txt and refuses a file whose sum differs.
      # Publishing a release is a maintainer's step (tag v<VERSION_NAME>, attach dist/*), so the
      # sums are built here and uploaded as an artifact.
      # The updater checks the APK it downloads against this file's SHA-256 before installing.
      - name: SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Nimbus-apks
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
