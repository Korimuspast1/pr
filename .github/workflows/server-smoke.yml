name: server-smoke-temporary

on:
  push:
    branches:
      - "arena/**"

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.ref == 'refs/heads/arena/01a0ed67-pr' && github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[server-smoke]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start local MyTelegram Compose stack
        run: |
          set -euo pipefail
          ./mytelegram-local/start-server.sh 127.0.0.1
          cd mytelegram-local/docker
          for attempt in $(seq 1 120); do
            running="$(docker compose --env-file .env ps --services --filter status=running)"
            missing=""
            for service in gateway-server auth-server session-server file-server messenger-command-server messenger-query-server sms-sender; do
              if ! grep -qx "$service" <<<"$running"; then
                missing="$missing $service"
              fi
            done
            if [ -z "$missing" ]; then
              echo "core services are running"
              break
            fi
            echo "waiting for:$missing (attempt $attempt/120)"
            sleep 5
          done
          test -z "$missing"
          docker compose --env-file .env ps
          docker compose --env-file .env logs --no-color --tail=80 gateway-server auth-server session-server
      - name: Stop stack
        if: always()
        run: |
          if [ -f mytelegram-local/docker/.env ]; then
            docker compose --env-file mytelegram-local/docker/.env -f mytelegram-local/docker/docker-compose.yml down -v || true
          fi
