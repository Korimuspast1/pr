name: Build complete OurCord client stack

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0ecf6-pr
    paths:
      - "ourcord-runtime/**"
      - "ourcord-loader/**"
      - "ourcord-manager/**"
      - ".github/workflows/ourcord-v2.yml"

permissions:
  contents: write

jobs:
  build:
    name: Runtime, loader and manager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build OurCord runtime
        working-directory: ourcord-runtime
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run build -- --release-branch main --build-minify
          test -s dist/ourcord.js
          test -s dist/ourcord.min.js

      - name: Embed runtime in OurCord loader
        run: |
          cp ourcord-runtime/dist/ourcord.min.js ourcord-loader/app/src/main/assets/ourcord.bundle

      - name: Set up Java 25 for loader
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: ourcord-loader/**/*.gradle*

      - name: Build OurCord loader APK
        working-directory: ourcord-loader
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Set up Java 17 for manager
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: ourcord-manager/**/*.gradle*

      - name: Build OurCord manager APK
        working-directory: ourcord-manager
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect and checksum release files
        run: |
          mkdir -p release-v2
          cp ourcord-loader/app/build/outputs/apk/debug/app-debug.apk release-v2/OurCord-Loader.apk
          cp ourcord-manager/app/build/outputs/apk/release/*.apk release-v2/OurCord-Manager-2.0.1.apk
          cp ourcord-runtime/dist/ourcord.js release-v2/ourcord.js
          cp ourcord-runtime/dist/ourcord.min.js release-v2/ourcord.min.js
          cd release-v2
          sha256sum OurCord-Loader.apk OurCord-Manager-2.0.1.apk ourcord.js ourcord.min.js > SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OurCord-complete-2.0.1
          path: release-v2/*
          if-no-files-found: error

      - name: Publish OurCord 2.0 direct downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ourcord-v2.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload ourcord-v2.0.1 release-v2/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create ourcord-v2.0.1 release-v2/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "OurCord 2.0.1 — complete client stack" \
              --notes "OurCord 2.0.1 contains its own branded manager, Android loader and JavaScript runtime. The manager downloads Discord split APKs, injects only the OurCord loader, signs the result locally and launches Android's installer. Discord APK is not redistributed. Android 9+ is required for the manager. Modified clients may violate Discord Terms of Service."
          fi
