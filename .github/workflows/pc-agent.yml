name: pc-agent

# агент слушает телеграм сменой до ~5.5 часов; cron каждые 10 минут поднимает
# новую смену, если предыдущей уже нет. если секрета с токеном нет — выходит
# за пару секунд и ничего не жжёт.
on:
  workflow_dispatch:
  push:
    branches: ['main', 'arena/**']
    paths: ['pc-agent/**', '.github/workflows/pc-agent.yml']
  schedule:
    - cron: '*/10 * * * *'

# один слушатель на токен: новый прогон вытесняет старый, иначе Conflict
concurrency:
  group: pc-agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: зависимости
        run: pip install -q requests psutil

      - name: самопроверка агента
        run: python pc-agent/agent.py --selftest

      - name: есть ли токен
        id: token
        env:
          PC_AGENT_TOKEN: ${{ secrets.PC_AGENT_TOKEN || secrets.YTDL_BOT_TOKEN }}
        run: |
          if [ -n "${{ secrets.PC_AGENT_TOKEN }}" ]; then
            echo "источник: секрет PC_AGENT_TOKEN"
          elif [ -n "$PC_AGENT_TOKEN" ]; then
            echo "источник: запасной секрет YTDL_BOT_TOKEN (PC_AGENT_TOKEN пуст)"
          fi
          if [ -z "$PC_AGENT_TOKEN" ]; then
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::error title=нужен токен::не нашёл ни PC_AGENT_TOKEN, ни YTDL_BOT_TOKEN. добавь любой из них в secrets"
          else
            echo "have=1" >> "$GITHUB_OUTPUT"
            echo "::notice title=токен найден::агент стартует (секрет подхвачен автоматически)"
          fi

      - name: запускаем агента
        if: steps.token.outputs.have == '1'
        working-directory: pc-agent
        env:
          # токен берём из любого из двух секретов, чтобы не перезаводить вручную
          PC_AGENT_TOKEN: ${{ secrets.PC_AGENT_TOKEN || secrets.YTDL_BOT_TOKEN }}
          # если список разрешённых не задан — агент работает в режиме «только
          # сообщает chat_id», управление появится после добавления владельца
          PC_AGENT_ALLOWED: ${{ secrets.PC_AGENT_ALLOWED || '*' }}
          PC_AGENT_WORKDIR: ${{ github.workspace }}
        run: python -u agent.py
