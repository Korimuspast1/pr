name: Android emulator smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
      - "main"
    paths:
      - ".github/workflows/android-smoke.yml"
      - ".github/scripts/android-smoke.sh"
      - "visaroom/app/src/debug/**"
      - "visaroom/app/src/main/**"
      - "visaroom/app/build.gradle"
      - "release/*.apk"

permissions:
  contents: write

jobs:
  smoke:
    name: API ${{ matrix.api-level }} seeded-session smoke
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      # The debug variant contains SmokeSeedActivity, which uses the app's
      # own encrypted TokenStore API to create a saved (but intentionally
      # invalid) session and then opens ChatsActivity. It is not part of
      # the release variant or the delivered signed APK.
      - name: Build debug APK with smoke seed
        working-directory: visaroom
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/android-smoke-api${{ matrix.api-level }}.txt"
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/visaroom-debug.apk"
          echo "SMOKE_APK=$RUNNER_TEMP/visaroom-debug.apk" >> "$GITHUB_ENV"
          echo "SMOKE_MODE=seeded" >> "$GITHUB_ENV"
          sha256sum "$RUNNER_TEMP/visaroom-debug.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch seeded debug APK in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          script: bash .github/scripts/android-smoke.sh ${{ matrix.api-level }} seeded

      - name: Commit smoke log
        if: always()
        continue-on-error: true
        run: |
          mkdir -p build-transfer
          SRC="android-smoke-api${{ matrix.api-level }}.txt"
          DST="build-transfer/android-smoke-api${{ matrix.api-level }}-log.txt"
          if [ -f "$SRC" ]; then
            tail -n 2000 "$SRC" > "$DST"
          else
            echo "No smoke log was produced." > "$DST"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$DST"
          if git diff --cached --quiet; then
            echo "Smoke log unchanged"
            exit 0
          fi
          git commit -m "CI: Android smoke API ${{ matrix.api-level }} log [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
