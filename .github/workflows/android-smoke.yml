name: Android emulator smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
      - "main"
    paths:
      - ".github/workflows/android-smoke.yml"
      - ".github/scripts/android-smoke.sh"
      - "release/*.apk"

permissions:
  contents: write

jobs:
  smoke:
    name: API ${{ matrix.api-level }} smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 34]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch delivered APK in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          script: bash .github/scripts/android-smoke.sh ${{ matrix.api-level }}
      - name: Commit smoke log
        if: always()
        continue-on-error: true
        run: |
          mkdir -p build-transfer
          SRC="android-smoke-api${{ matrix.api-level }}.txt"
          DST="build-transfer/android-smoke-api${{ matrix.api-level }}-log.txt"
          if [ -f "$SRC" ]; then
            tail -n 1200 "$SRC" > "$DST"
          else
            echo "No smoke log was produced." > "$DST"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$DST"
          if git diff --cached --quiet; then
            echo "Smoke log unchanged"
            exit 0
          fi
          git commit -m "CI: Android smoke API ${{ matrix.api-level }} log [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
