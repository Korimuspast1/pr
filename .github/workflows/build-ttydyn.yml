name: build-ttydyn

on:
  push:
    branches: ["arena/01a0ed43-pr"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve Android SDK
        run: |
          echo "ANDROID_JAR=$(ls -d $ANDROID_HOME/platforms/android-*/android.jar | sort -V | tail -1)" >> $GITHUB_ENV
          echo "D8=$(ls -d $ANDROID_HOME/build-tools/*/d8 | sort -V | tail -1)" >> $GITHUB_ENV

      - name: Build profile-flex.ttydyn
        run: ./profile-flex/build.sh

      - name: Inspect result
        run: python3 tools/ttydyn.py inspect release/profile-flex.ttydyn --classes 20

      - uses: actions/upload-artifact@v4
        with:
          name: profile-flex-ttydyn
          path: |
            release/profile-flex.ttydyn
            keys/dev.pub.pem

      # Готовый модуль кладём прямо в репозиторий, чтобы его можно было скачать
      # одним кликом, без захода в артефакты Actions.
      - name: Commit built module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/profile-flex.ttydyn keys/dev.pub.pem
          if git diff --cached --quiet; then
            echo "нет изменений"
            exit 0
          fi
          git commit -m "ci: rebuild profile-flex.ttydyn [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
