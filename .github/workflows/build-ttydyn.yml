name: build-ttydyn

on:
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:
    inputs:
      build_android:
        description: "Собрать Android-клиент MyTelegram"
        required: false
        default: false
        type: boolean
      server_ip:
        description: "IP локального MyTelegram backend для APK"
        required: false
        default: "192.168.1.100"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          android_jar="$(find "$ANDROID_HOME/platforms" -mindepth 2 -maxdepth 2 -type f -name android.jar | sort -V | tail -n 1)"
          d8="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name d8 | sort -V | tail -n 1)"
          test -f "$android_jar"
          test -f "$d8"
          {
            echo "ANDROID_JAR=$android_jar"
            echo "D8=$d8"
          } >> "$GITHUB_ENV"

      # The repository contains only the public dev key. A clean CI checkout
      # therefore gets an explicit, matching ephemeral pair; the public half
      # is published beside the .ttydyn file and is what a dev APK must embed.
      - name: Build signed profile-flex.ttydyn
        run: TTY_GENERATE_KEY=1 ./profile-flex/build.sh

      - name: Validate archive and signature
        run: |
          python3 tools/ttydyn.py inspect release/profile-flex.ttydyn --classes 20
          python3 tools/ttydyn.py verify release/profile-flex.ttydyn --pub keys/dev.pub.pem
          unzip -t release/profile-flex.ttydyn

      - uses: actions/upload-artifact@v4
        with:
          name: profile-flex-ttydyn
          path: |
            release/profile-flex.ttydyn
            keys/dev.pub.pem

      # Keep a ready-to-download package in the repository. [skip ci] below
      # prevents this bot commit from starting another build recursively.
      - name: Commit built module
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/profile-flex.ttydyn keys/dev.pub.pem
          if git diff --cached --quiet; then
            echo "нет изменений"
            exit 0
          fi
          git commit -m "ci: rebuild profile-flex.ttydyn [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # Optional heavy build. It is started only manually with build_android=true,
  # so normal ttydyn changes remain fast.
  build-android:
    # The session branch also gets one automatic build so the first APK is
    # available without requiring workflow-dispatch permissions.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_android == true) || (github.event_name == 'push' && github.ref == 'refs/heads/arena/01a0ed67-pr' && github.actor != 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;21.4.7075529"

      - name: Build MyTelegram Android APK
        env:
          MYTELEGRAM_IP: ${{ inputs.server_ip || '192.168.1.100' }}
        run: ./mytelegram-local/build-client.sh "$MYTELEGRAM_IP"

      - name: Validate APK output
        run: |
          find mytelegram-local/build/apk -type f -name '*.apk' -print
          test -n "$(find mytelegram-local/build/apk -type f -name '*.apk' -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: mytelegram-android-${{ inputs.server_ip || '192.168.1.100' }}
          path: mytelegram-local/build/apk/*.apk
          if-no-files-found: error
