name: build-ttydyn

on:
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:
    inputs:
      build_android:
        description: "Собрать Android-клиент MyTelegram"
        required: false
        default: false
        type: boolean
      server_ip:
        description: "IP локального MyTelegram backend для APK"
        required: false
        default: "192.168.1.100"
        type: string

permissions:
  contents: write

concurrency:
  group: ttydyn-and-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-apk]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          android_jar="$(find "$ANDROID_HOME/platforms" -mindepth 2 -maxdepth 2 -type f -name android.jar | sort -V | tail -n 1)"
          d8="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name d8 | sort -V | tail -n 1)"
          test -f "$android_jar"
          test -f "$d8"
          {
            echo "ANDROID_JAR=$android_jar"
            echo "D8=$d8"
          } >> "$GITHUB_ENV"

      # The repository contains only the public dev key. A clean CI checkout
      # therefore gets an explicit, matching ephemeral pair; the public half
      # is published beside the .ttydyn file and is what a dev APK must embed.
      - name: Build signed profile-flex.ttydyn
        run: TTY_GENERATE_KEY=1 ./profile-flex/build.sh

      - name: Validate archive and signature
        run: |
          python3 tools/ttydyn.py inspect release/profile-flex.ttydyn --classes 20
          python3 tools/ttydyn.py verify release/profile-flex.ttydyn --pub keys/dev.pub.pem
          unzip -t release/profile-flex.ttydyn

      - uses: actions/upload-artifact@v4
        with:
          name: profile-flex-ttydyn
          path: |
            release/profile-flex.ttydyn
            keys/dev.pub.pem

      # Keep a ready-to-download package in the repository. [skip ci] below
      # prevents this bot commit from starting another build recursively.
      - name: Commit built module
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/profile-flex.ttydyn keys/dev.pub.pem
          if git diff --cached --quiet; then
            echo "нет изменений"
            exit 0
          fi
          git commit -m "ci: rebuild profile-flex.ttydyn [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # Optional heavy build. It is started only manually with build_android=true,
  # so normal ttydyn changes remain fast.
  build-android:
    # The session branch also gets one automatic build so the first APK is
    # available without requiring workflow-dispatch permissions.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_android == true) || (github.event_name == 'push' && github.ref == 'refs/heads/arena/01a0ed67-pr' && github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[publish-apk]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install Android SDK and NDK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          set -euo pipefail
          sdk_root="$ANDROID_HOME"
          mkdir -p "$sdk_root/cmdline-tools"
          curl --fail --location --retry 3 \
            -o "$RUNNER_TEMP/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          export PATH="$sdk_root/cmdline-tools/latest/bin:$sdk_root/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$sdk_root" --licenses >/dev/null || true
          sdkmanager --sdk_root="$sdk_root" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;21.4.7075529"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "PATH=$sdk_root/cmdline-tools/latest/bin:$sdk_root/platform-tools:$PATH"
          } >> "$GITHUB_ENV"

      - name: Build MyTelegram Android APK
        env:
          MYTELEGRAM_IP: ${{ inputs.server_ip || '192.168.1.100' }}
        run: ./mytelegram-local/build-client.sh "$MYTELEGRAM_IP"

      - name: Validate APK output and signature
        run: |
          set -euo pipefail
          apk="$(find mytelegram-local/build/apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          echo "APK=$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='org.mytelegram.local'"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/'
          ! unzip -l "$apk" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'
          sha256sum "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: mytelegram-android-${{ inputs.server_ip || '192.168.1.100' }}
          path: mytelegram-local/build/apk/*.apk
          if-no-files-found: error

  # One-time publisher for the already validated APK from the long Android run.
  # It is activated only by the explicit [publish-apk] maintenance commit.
  publish-mytelegram-apk:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/arena/01a0ed67-pr' && contains(github.event.head_commit.message, '[publish-apk]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download validated Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mytelegram-apk"
          gh run download 36645825215 \
            --repo "$GITHUB_REPOSITORY" \
            --name "mytelegram-android-192.168.1.100" \
            --dir "$RUNNER_TEMP/mytelegram-apk"
          apk="$(find "$RUNNER_TEMP/mytelegram-apk" -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          echo "Downloaded $apk"
          mkdir -p mytelegram-local/apk
          rm -f mytelegram-local/apk/*.apk
          cp "$apk" mytelegram-local/apk/MyTelegram-local-arm64-v8a-36645825215.apk

          sha256="$(sha256sum mytelegram-local/apk/MyTelegram-local-arm64-v8a-36645825215.apk | awk '{print $1}')"
          size="$(stat -c '%s' mytelegram-local/apk/MyTelegram-local-arm64-v8a-36645825215.apk)"
          SHA256="$sha256" SIZE="$size" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("mytelegram-local/README.md")
          text = path.read_text(encoding="utf-8")
          block = (
              "APK для текущего endpoint публикуется в артефактах workflow после проверки `apksigner`.\n"
              f"Готовый файл в репозитории: `MyTelegram-local-arm64-v8a-36645825215.apk` "
              f"({os.environ['SIZE']} байт); SHA-256: `{os.environ['SHA256']}`."
          )
          pattern = re.escape("APK для текущего endpoint публикуется в артефактах workflow после проверки `apksigner`.")
          text, count = re.subn(pattern, block, text, count=1)
          if count != 1:
              raise SystemExit("README APK marker not found")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate downloaded APK before publishing
        run: |
          set -euo pipefail
          apk="mytelegram-local/apk/MyTelegram-local-arm64-v8a-36645825215.apk"
          command -v aapt >/dev/null 2>&1 || true
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/'
          ! unzip -l "$apk" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'
          sha256sum "$apk"

      - name: Commit APK deliverable
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f mytelegram-local/apk/*.apk mytelegram-local/README.md
          git commit -m "ci: publish validated MyTelegram APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
