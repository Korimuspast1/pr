name: build-ttydyn

on:
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:
    inputs:
      build_android:
        description: "Собрать Android-клиент MyTelegram"
        required: false
        default: false
        type: boolean
      server_ip:
        description: "IP локального MyTelegram backend для APK"
        required: false
        default: "192.168.1.100"
        type: string
      publish_apk:
        description: "Опубликовать APK из уже успешного run как release asset"
        required: false
        default: false
        type: boolean
      source_run_id:
        description: "Run ID успешной Android-сборки для публикации APK"
        required: false
        default: ""
        type: string
      artifact_name:
        description: "Имя APK artifact для публикации"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: ttydyn-and-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          android_jar="$(find "$ANDROID_HOME/platforms" -mindepth 2 -maxdepth 2 -type f -name android.jar | sort -V | tail -n 1)"
          d8="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name d8 | sort -V | tail -n 1)"
          test -f "$android_jar"
          test -f "$d8"
          {
            echo "ANDROID_JAR=$android_jar"
            echo "D8=$d8"
          } >> "$GITHUB_ENV"

      # The repository contains only the public dev key. A clean CI checkout
      # therefore gets an explicit, matching ephemeral pair; the public half
      # is published beside the .ttydyn file and is what a dev APK must embed.
      - name: Build signed profile-flex.ttydyn
        run: TTY_GENERATE_KEY=1 ./profile-flex/build.sh

      - name: Validate archive and signature
        run: |
          python3 tools/ttydyn.py inspect release/profile-flex.ttydyn --classes 20
          python3 tools/ttydyn.py verify release/profile-flex.ttydyn --pub keys/dev.pub.pem
          unzip -t release/profile-flex.ttydyn

      - uses: actions/upload-artifact@v4
        with:
          name: profile-flex-ttydyn
          path: |
            release/profile-flex.ttydyn
            keys/dev.pub.pem

      # Keep a ready-to-download package in the repository. [skip ci] below
      # prevents this bot commit from starting another build recursively.
      - name: Commit built module
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/profile-flex.ttydyn keys/dev.pub.pem
          if git diff --cached --quiet; then
            echo "нет изменений"
            exit 0
          fi
          git commit -m "ci: rebuild profile-flex.ttydyn [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # Optional heavy build. It is started only manually with build_android=true,
  # so normal ttydyn changes remain fast.
  build-android:
    # The session branch also gets one automatic build so the first APK is
    # available without requiring workflow-dispatch permissions.
    if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.build_android == true) || (github.event_name == 'push' && github.ref == 'refs/heads/arena/01a0ed67-pr' && github.actor != 'github-actions[bot]')) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-apk]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install Android SDK and NDK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          set -euo pipefail
          sdk_root="$ANDROID_HOME"
          mkdir -p "$sdk_root/cmdline-tools"
          curl --fail --location --retry 3 \
            -o "$RUNNER_TEMP/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          export PATH="$sdk_root/cmdline-tools/latest/bin:$sdk_root/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$sdk_root" --licenses >/dev/null || true
          sdkmanager --sdk_root="$sdk_root" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;21.4.7075529"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "PATH=$sdk_root/cmdline-tools/latest/bin:$sdk_root/platform-tools:$PATH"
          } >> "$GITHUB_ENV"

      - name: Build MyTelegram Android APK
        env:
          MYTELEGRAM_IP: ${{ inputs.server_ip || '192.168.1.100' }}
        run: ./mytelegram-local/build-client.sh "$MYTELEGRAM_IP"

      - name: Validate APK output
        run: |
          find mytelegram-local/build/apk -type f -name '*.apk' -print
          test -n "$(find mytelegram-local/build/apk -type f -name '*.apk' -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: mytelegram-android-${{ inputs.server_ip || '192.168.1.100' }}
          path: mytelegram-local/build/apk/*.apk
          if-no-files-found: error

  publish-apk:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_apk == true && inputs.source_run_id != '' && inputs.artifact_name != '') || (github.event_name == 'push' && github.ref == 'refs/heads/arena/01a0ed67-pr' && github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[publish-apk]')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact from successful build
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'mytelegram-android-192.168.1.100' }}
          path: downloaded-apk
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || '36586737127' }}
          github-token: ${{ github.token }}

      - name: Validate APK
        run: |
          set -euo pipefail
          apk="$(find downloaded-apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          echo "APK=$apk"
          sha256sum "$apk"
          ls -lh "$apk"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_run_id="${{ inputs.source_run_id || '36586737127' }}"
          tag="mytelegram-apk-${source_run_id}"
          apk="$(find downloaded-apk -type f -name '*.apk' -print -quit)"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "MyTelegram local APK (run ${source_run_id})" \
            --notes "Example APK from the local MyTelegram build. It embeds the server endpoint selected for that build; rebuild with mytelegram-local/build-client.sh SERVER_IP for another LAN address. This is not the production Telegram client." \
            --target "$GITHUB_SHA"
          gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets

      # The Arena sandbox cannot fetch GitHub's Azure artifact CDN directly.
      # Keep this one required deliverable in the session branch as well as in
      # the release, so it remains downloadable through the normal git remote.
      - name: Keep verified APK in repository deliverables
        run: |
          set -euo pipefail
          source_run_id="${{ inputs.source_run_id || '36586737127' }}"
          apk="$(find downloaded-apk -type f -name '*.apk' -print -quit)"
          dest="mytelegram-local/apk/MyTelegram-local-arm64-v8a-${source_run_id}.apk"
          mkdir -p "$(dirname "$dest")"
          cp "$apk" "$dest"
          sha256sum "$dest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$dest"
          if git diff --cached --quiet; then
            echo "APK уже сохранён"
          else
            git commit -m "ci: store verified MyTelegram APK [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
