name: Build UE Audio Extractor (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/d0a553e3-pr
    paths:
      - "UE Audio Extractor.pyw"
      - "ue_audio_extractor/**"
      - ".github/workflows/build-ue-audio-extractor.yml"

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s ue_audio_extractor/tests -v

      - name: Install packager
        run: python -m pip install --upgrade pyinstaller

      - name: Build standalone GUI executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name UE-Audio-Extractor-windows-x64 "UE Audio Extractor.pyw"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: UE-Audio-Extractor-windows-x64
          path: dist/UE-Audio-Extractor-windows-x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct-download GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ue-audio-extractor-v1.0.0
          target_commitish: ${{ github.sha }}
          name: UE Audio Extractor v1.0.0 — Windows x64
          body: |
            Standalone Windows x64 GUI build. Download `UE-Audio-Extractor-windows-x64.exe` and launch it.

            For MP3/FLAC/WAV/OGG transcoding, install FFmpeg; copying supported source streams works without it.
          files: dist/UE-Audio-Extractor-windows-x64.exe
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
