name: glass-chat-roulette

on:
  push:
    paths:
      - 'chat-roulette/**'
      - '.github/workflows/chat-roulette.yml'
      - '!chat-roulette/screenshots/**'
      - '!chat-roulette/README.md'
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: glass-chat-roulette-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: chat-roulette
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee /tmp/build.log

      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          lines = open('/tmp/build.log', errors='replace').read().splitlines()
          keep = [l for l in lines if l.startswith('e: ') or 'error:' in l.lower() or 'What went wrong' in l
                  or 'Could not' in l or 'FAILURE' in l or 'Unresolved' in l or '> ' in l[:6]]
          msg = '\n'.join(keep[:150]) or '\n'.join(lines[-80:])
          msg = msg.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error title=build::' + msg[:60000])
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" GlassRoulette.apk
          TAG="chat-roulette-v1.0.${GITHUB_RUN_NUMBER}"
          NOTES="Glass Roulette — видео-чат-рулетка в стиле Liquid Glass: WebRTC P2P, сквозное шифрование чата (ECDH P-256 + AES-256-GCM), фильтры, блюр камеры, чёрный список. Android 6.0+ (API 23+). Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}."
          gh release create "$TAG" GlassRoulette.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Glass Roulette 1.0.${GITHUB_RUN_NUMBER}" --notes "$NOTES" --latest=false
          echo "::notice title=apk::https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/GlassRoulette.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GlassRoulette
          path: chat-roulette/GlassRoulette.apk

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [24, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GlassRoulette
          path: chat-roulette
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: pip install pillow
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API: ${{ matrix.api }}
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: chat-roulette
          script: python3 ci/smoke.py
