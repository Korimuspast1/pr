<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>Wave — музыка</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">◍</div>
      <div>
        <strong>Wave</strong>
        <span>поиск музыки</span>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="search">⌕ Поиск</button>
      <button class="nav-item" data-view="favorites">♥ Избранное</button>
      <button class="nav-item" data-view="history">↻ История</button>
    </nav>

    <div class="sources" id="sources"></div>

    <div class="sidebar-foot">
      <a href="https://soundcloud.com" target="_blank" rel="noopener noreferrer">SoundCloud ↗</a>
      <a href="https://www.jamendo.com" target="_blank" rel="noopener noreferrer">Jamendo ↗</a>
      <a href="https://archive.org/details/audio" target="_blank" rel="noopener noreferrer">Archive ↗</a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <form id="search-form" class="search" autocomplete="off">
        <span class="search-icon">⌕</span>
        <input id="q" type="search" name="q" placeholder="Что послушаем? трек, артист, жанр…" enterkeyhint="search">
        <button type="submit" class="search-go">Найти</button>
      </form>
      <div class="chips" id="chips">
        <button class="chip active" data-source="all">Всё</button>
        <button class="chip" data-source="soundcloud">SoundCloud</button>
        <button class="chip" data-source="jamendo">Jamendo</button>
        <button class="chip" data-source="archive">Archive</button>
      </div>
    </header>

    <section class="viewport">
      <div id="hero" class="hero">
        <h1>Вся музыка в одном месте</h1>
        <p>Ищем по каталогу SoundCloud и бесплатным каталогам Creative&nbsp;Commons.
           Что можно — играем прямо тут, остальное открываем в официальном плеере SoundCloud.</p>
        <div class="quick" id="quick">
          <button data-q="lofi hip hop">lofi</button>
          <button data-q="phonk">phonk</button>
          <button data-q="русский рэп">рэп</button>
          <button data-q="jazz">jazz</button>
          <button data-q="electronic">electronic</button>
          <button data-q="classical piano">классика</button>
        </div>
      </div>

      <div id="status" class="status" hidden></div>
      <div id="grid" class="grid"></div>
      <div id="pagination" class="pagination" hidden></div>
    </section>
  </main>
</div>

<div class="player" id="player">
  <div class="now">
    <div class="cover" id="cover">◍</div>
    <div class="meta">
      <div class="title" id="np-title">Ничего не играет</div>
      <div class="artist" id="np-artist">Выбери трек</div>
    </div>
  </div>

  <div class="controls">
    <button id="prev" class="icon-btn" title="Предыдущий">⏮</button>
    <button id="play" class="play-btn" title="Играть (пробел)">▶</button>
    <button id="next" class="icon-btn" title="Следующий">⏭</button>
    <div class="progress-wrap">
      <span id="t-cur">0:00</span>
      <input id="progress" type="range" min="0" max="1000" value="0" step="1" aria-label="Перемотка">
      <span id="t-dur">0:00</span>
    </div>
    <input id="volume" class="volume" type="range" min="0" max="1" step="0.01" value="0.9" aria-label="Громкость">
    <button id="sc-open" class="ghost-btn" hidden>SoundCloud ↗</button>
  </div>

  <div id="sc-slot" class="sc-slot" hidden></div>
  <audio id="audio" preload="none" crossorigin="anonymous"></audio>
</div>

<div id="toast" class="toast" hidden></div>

<template id="card-tpl">
  <article class="card">
    <button class="card-play" aria-label="Играть">▶</button>
    <div class="card-art"><img alt="" loading="lazy" decoding="async"></div>
    <div class="card-body">
      <div class="card-title"></div>
      <div class="card-artist"></div>
      <div class="card-tags"><span class="tag provider"></span><span class="tag dur"></span><span class="tag genre"></span></div>
    </div>
    <div class="card-actions">
      <button class="mini fav" title="В избранное">♡</button>
      <a class="mini link" target="_blank" rel="noopener noreferrer" title="Открыть источник">↗</a>
    </div>
  </article>
</template>

<script type="module" src="/app.js"></script>
</body>
</html>
