<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sandboxOS — рабочий стол</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="wallpaper" id="wallpaper"></div>

<!-- ── top panel ─────────────────────────────────────────────────── -->
<header id="panel">
  <button class="panel-btn apps-btn" id="appsBtn" title="Приложения (Super)">
    <span class="ico" id="appsIco"></span>
    <span class="apps-label">Приложения</span>
  </button>
  <div class="panel-tasks" id="tasks"></div>
  <div class="panel-right">
    <button class="indicator root-ind hidden" id="rootIndicator" title="root mode включён">
      <span class="ico" id="rootIco"></span><span>root</span>
    </button>
    <button class="indicator" id="cpuIndicator" title="Загрузка CPU">
      <span class="ico" id="cpuIco"></span><span id="cpuTxt">0%</span>
    </button>
    <button class="indicator" id="netIndicator" title="Соединение с сервером">
      <span class="ico" id="netIco"></span>
    </button>
    <button class="indicator" id="quickBtn" title="Быстрые настройки">
      <span class="ico" id="volumeIco"></span>
      <span class="ico" id="batteryIco"></span>
    </button>
    <button class="indicator clock" id="clockBtn" title="Календарь">
      <span id="clockTxt">—</span>
    </button>
    <button class="indicator user-ind" id="userBtn" title="Меню пользователя">
      <span class="ico" id="userIco"></span>
    </button>
  </div>
</header>

<!-- ── windows ───────────────────────────────────────────────────── -->
<div id="windows" class="windows"></div>
<div id="toasts" class="toasts"></div>

<!-- ── dock ──────────────────────────────────────────────────────── -->
<nav id="dock" class="dock"></nav>

<!-- ── launcher ──────────────────────────────────────────────────── -->
<div id="launcher" class="overlay hidden">
  <div class="launcher-box">
    <div class="launcher-search">
      <span class="ico" id="searchIco"></span>
      <input id="launcherInput" placeholder="Поиск приложений…" autocomplete="off" spellcheck="false" />
      <kbd>Esc</kbd>
    </div>
    <div class="launcher-grid" id="launcherGrid"></div>
    <div class="launcher-hint">↑↓ выбрать · Enter открыть · Super или клик по фону — закрыть</div>
  </div>
</div>

<!-- ── popovers ──────────────────────────────────────────────────── -->
<div id="quick" class="popover hidden"></div>
<div id="userMenu" class="popover hidden"></div>
<div id="calendar" class="popover hidden"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
