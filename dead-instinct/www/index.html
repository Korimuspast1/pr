<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0c0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dead Instinct — зомби-хоррор выживание</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="cv"></canvas>

<!-- ============ HUD ============ -->
<div id="hud" class="hidden">
  <div id="topbar">
    <div id="clock">17:40</div>
    <div id="chap">ЭП. 1 · Тихий час</div>
    <div id="noise"><span>ШУМ</span><div class="bars" id="noiseBars"><i></i><i></i><i></i><i></i><i></i></div></div>
    <button class="btn" id="menuBtn" aria-label="меню">≡</button>
  </div>

  <div id="vitals">
    <div class="bar hp"><i id="barHp" style="width:100%"></i><span id="hpTxt">100</span></div>
    <div class="bar st"><i id="barSt" style="width:100%"></i></div>
    <div class="bar hu"><i id="barHu" style="width:100%"></i></div>
    <div class="bar th"><i id="barTh" style="width:100%"></i></div>
    <div class="bar in" id="barInWrap" style="display:none"><i id="barIn" style="width:0%"></i><span>ЗАРАЖЕНИЕ</span></div>
  </div>

  <div id="objective" class="panel"></div>
  <div id="trustBox" class="panel" style="padding:.4em .5em"></div>

  <div id="instincts">
    <button class="btn ibtn" id="iDanger"><img alt=""><span>ЧУТЬЁ</span><div class="cd"></div></button>
    <button class="btn ibtn" id="iBreath"><img alt=""><span>ЗАТАИТЬСЯ</span></button>
    <button class="btn ibtn" id="iDraw"><img alt=""><span>ОТВЕСТИ</span></button>
    <button class="btn ibtn" id="iInv"><img alt=""><span>РЮКЗАК</span></button>
  </div>

  <div id="party"></div>

  <div id="actions">
    <button class="btn abtn" data-act="sneak"><img alt="">КРАДУЧИСЬ</button>
    <button class="btn abtn" data-act="sprint"><img alt="">БЕГ</button>
    <button class="btn abtn" data-act="light"><img alt="">ФОНАРЬ</button>
    <button class="btn abtn" id="invBtn"><img alt="">РЮКЗАК</button>
  </div>

  <div id="quick">
    <button class="btn qbtn" id="qMed"><img alt=""><b id="medN"></b><span class="k">+</span></button>
    <button class="btn qbtn" id="qFood"><img alt=""><b id="foodN"></b><span class="k">+</span></button>
    <button class="btn qbtn" id="torchBtn"><img alt=""><span class="k">F</span></button>
    <button class="btn qbtn" id="wSlot"><img id="wIcon" alt=""><b id="wAmmo"></b></button>
  </div>

  <button class="btn" id="interactBtn">ОБЫСКАТЬ</button>

  <div id="stickL" class="stick"><div class="knob"></div></div>
  <div id="stickR" class="stick cam"><div class="knob"></div></div>

  <div id="banner"></div>
  <div id="hint"></div>

  <div id="dialogue" class="hidden">
    <div class="portrait" id="dlgPortrait"></div>
    <div style="flex:1">
      <div class="who" id="dlgWho"></div>
      <div class="txt" id="dlgText"></div>
      <div class="nextHint" id="dlgNext">▸</div>
    </div>
  </div>
  <div id="choice" class="hidden"></div>
</div>

<!-- ============ главное меню ============ -->
<div id="menu">
  <div class="mtitle">DEAD INSTINCT</div>
  <div class="msub">ИНСТИНКТ ВЫЖИВАНИЯ</div>
  <div class="mtags">СКРЫТНОСТЬ · ШУМ · ГОЛОД · ДОВЕРИЕ · ПОСЛЕДСТВИЯ</div>
  <div class="mcol">
    <button class="btn gold" id="menuNew">НОВАЯ ИГРА</button>
    <button class="btn hidden" id="menuCont">ПРОДОЛЖИТЬ<span class="tiny dimt" id="contInfo" style="display:block"></span></button>
    <button class="btn" id="menuHow">КАК ИГРАТЬ</button>
    <button class="btn" id="menuCine">ЗАСТАВКИ</button>
    <button class="btn dim" id="menuSet">НАСТРОЙКИ</button>
  </div>
  <div class="mver">v1.0.0 · офлайн · без разрешений</div>
</div>

<!-- ============ инвентарь ============ -->
<div id="inv" class="hidden">
  <div class="head" style="display:flex;align-items:center;gap:.6em;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:2px solid #000;background:#0f110d">
    <h2 style="margin:0;font-size:1em;color:var(--gold);letter-spacing:.08em;font-weight:normal;flex:1">РЮКЗАК</h2>
    <button class="btn" id="invClose">✕</button>
  </div>
  <div class="items" id="invItems"></div>
  <div class="foot" style="padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:2px solid #000;background:#0f110d">
    <div class="tiny" id="invInfo"></div>
  </div>
</div>

<div id="modal" class="hidden"></div>
<div id="cine" class="hidden"></div>
<div id="toast"></div>

<script src="js/data.js"></script>
<script src="js/map.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/story.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
